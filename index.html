egún el modelo. La misma conversación en Opus cuesta 5 veces más que en Sonnet.\n- **Consumo (burn)**: cuántos tokens gastas por tus propios hábitos — subir un PDF entero cuando podrías pegar el markdown, dejar que Claude escriba 500 palabras cuando necesitabas una frase, o mantener una conversación 30 mensajes cuando deberías haber empezado una nueva en el mensaje 10.\n\nEl coste es el multiplicador, el consumo es el volumen. Reducir uno se nota; reducir los dos hace que dejes de tocar el límite.\n\n## Los planes, en cifras\nTodos comparten el mismo cupo entre claude.ai, Claude Code, la app de escritorio y Cowork — una sesión intensa de Claude Code por la mañana deja menos mensajes disponibles en el chat por la tarde.\n\n- **Free**: ~40 mensajes cortos al día — para probarlo, no para trabajar en serio.\n- **Pro (20$/mes)**: ~44.000 tokens por ventana de 5 horas — bien para aprender, ajustado para diseño pesado.\n- **Max5 (100$/mes)**: ~88.000 tokens — cómodo para trabajo diario de diseño.\n- **Max20 (200$/mes)**: ~220.000 tokens — usuarios intensivos, varios proyectos a la vez.\n\n## Por qué los diseñadores gastan tan rápido\n- **La iteración visual en bucle**: \"hazlo más grande\" → \"mejor más pequeño\" → \"¿lo centras?\" → \"el color no cuadra\". Cada una de estas peticiones minúsculas reprocesa toda la conversación; en el mensaje 10 ya estás pagando por reenviar los 9 anteriores cada vez.\n- **El impuesto de las herramientas MCP**: cada conector que tienes activo carga su definición en cada mensaje, lo uses o no. Sin herramientas: 0 tokens de más. Solo Figma MCP: ~4.000 tokens (~10% del cupo Pro antes de escribir nada). 4 herramientas conectadas: ~7.000 tokens (~16%). Una instalación pesada (5+ herramientas): hasta 55.000 tokens, capaz de superar todo tu cupo.\n- **El error de selección en Figma**: seleccionar toda la página en vez de solo el componente en el que trabajas. Un componente suelto: 2.000-10.000 tokens. La página entera: 200.000+ tokens. Una diferencia de 20 a 100 veces.\n- **El modelo equivocado para la tarea**: usar Opus para retoques de copy cuando Sonnet resuelve el 98% de las tareas de diseño con un 80% menos de coste.\n\n## Diez situaciones típicas que queman el límite\nLa guía repasa diez escenarios concretos —iterar visualmente, construir un componente con retoques pequeños, usar Figma MCP, subir los mismos archivos una y otra vez, compartir mockups para revisión, pedir feedback de diseño, investigar y hacer brainstorming, tener conectores MCP siempre activos, usar el modelo equivocado, y dejar el extended thinking siempre encendido— y para cada uno da la versión cara y la versión barata de hacerlo.\n\n## ¿Se puede entrenar a Claude para ser eficiente en tokens? Sí, con una Skill\nSe puede crear un archivo SKILL.md que le indique a Claude que sea consciente de los tokens: por ejemplo, que constriña sus respuestas, que pida confirmación antes de generar mucho texto, o que use el modelo adecuado por defecto. Una Skill es un archivo de instrucciones que Claude lee y sigue automáticamente, así que \"entrenas\" un comportamiento una vez en vez de repetirlo en cada conversación. Y no es solo para eficiencia: crear Skills para las cosas que repites constantemente hace que Claude acierte a la primera en vez de necesitar cinco rondas de correcciones.\n\n## La parte incómoda: los prompts vagos también gastan\nUsar Claude mucho puede volvernos perezosos al escribir, y un prompt perezoso sale caro: si no das las specs por adelantado (padding, fuentes, colores, spacing), Claude tiene que adivinar, tú corriges, y cada corrección reprocesa todo lo anterior. El arreglo es pensar antes de escribir, no después.\n\n## La chuleta rápida\nAntes de empezar una sesión: ¿tienes Sonnet seleccionado (no Opus)?, ¿extended thinking apagado para tareas simples?, ¿solo los conectores MCP que necesitas activos?, ¿el contenido reutilizable ya está en Project Knowledge? Durante el trabajo: junta el feedback y mándalo en un solo mensaje, da las specs por adelantado, constriñe la respuesta (\"máximo 3 puntos\"), recorta las imágenes sin piedad. Empieza una conversación nueva al terminar una tarea, cada 15-20 mensajes, o al cambiar a un tema no relacionado.\n\n## Ideas clave\n- Cada mensaje reprocesa toda la conversación: cuanto más larga, más caro cada turno nuevo.\n- El coste depende del modelo (Opus vs Sonnet) y el consumo depende de tus hábitos (qué subes, cuánto dejas escribir a Claude, cuándo empiezas de cero).\n- Seleccionar solo el componente en Figma MCP en vez de la página entera puede ahorrar hasta 100 veces los tokens.\n- Los conectores MCP activos cobran un peaje en cada mensaje aunque no los uses ese turno — desconecta los que no necesites.\n- Una Skill puede 'entrenar' a Claude a ser eficiente o a acertar a la primera en tareas repetitivas, sin tener que repetir instrucciones cada vez.", "images": ["images/los-disenadores-gastan-los-limites-de-uso-de-claude-mas-rapido-que-nad/cover.svg"], "glossary": [{"term": "Rate limit / ventana de uso", "definition": "El cupo de tokens que tienes disponible dentro de una ventana de tiempo (por ejemplo, 5 horas), según tu plan. Se comparte entre todas las formas de usar Claude —chat, Claude Code, la app de escritorio, Cowork— así que gastarlo en un sitio deja menos disponible en los demás."}, {"term": "Extended thinking", "definition": "Un modo en el que Claude 'piensa' de forma más extendida antes de responder, útil para tareas complejas, pero que cuesta bastantes tokens de más (unos 32.000 por petición) incluso en tareas sencillas donde no hace falta. Apagarlo para preguntas simples ahorra buena parte del cupo."}, {"term": "Modelo (Opus vs Sonnet)", "definition": "Las distintas 'versiones' de Claude que puedes elegir para una conversación. Opus es más potente pero cuesta unas 5 veces más tokens que Sonnet por el mismo trabajo; para la mayoría de tareas de diseño, Sonnet da un resultado prácticamente igual de bueno a una fracción del coste."}, {"term": "Skill (archivo SKILL.md)", "definition": "Un archivo de instrucciones que Claude lee y aplica automáticamente sin que tengas que repetirlas cada vez — por ejemplo, para que sea más breve por defecto, o para que resuelva bien una tarea que sueles pedirle. Es la forma de 'enseñarle' un comportamiento de una vez, en lugar de corregirlo conversación tras conversación."}], "date_added": "2026-07-12"}, {"id": "diccionario-de-ia-para-disenadores", "title": "Diccionario de IA para diseñadores", "url": "https://yummy-design-sprint.notion.site/AI-Design-Dictionary-326627914709808eb562c22421ba2088", "section": "teoria", "subsection": "Diccionario de referencia", "summary": "Un diccionario de 63 términos técnicos de IA y desarrollo, escrito por una diseñadora para diseñadoras, organizado en tres niveles: los básicos de la primera semana, lo que aparece al profundizar un poco, y lo que solo hace falta si te metes de lleno. Cada término trae la traducción a lenguaje de diseño y por qué importa para trabajar con IA. Todos sus términos se guardan directamente en la Enciclopedia, sin tener que darles like uno a uno.", "key_points": ["63 términos organizados en tres niveles: 'Empieza aquí' (los que se usan en la primera semana), 'Nivel 2' (los que aparecen en tutoriales y con ingeniería) y 'Términos avanzados' (infraestructura y conceptos de IA más profundos)", "Cada término se explica con su traducción a lenguaje de diseño: por ejemplo, Git es 'como el historial de versiones de Figma, pero mucho más potente'", "Cubre desde lo más básico (CLI, Terminal, API) hasta conceptos de IA (RAG, embeddings, fine-tuning, alucinaciones) y de despliegue (dominio, DNS, hosting)", "Pensado como referencia para volver cuando te encuentres una palabra que no conoces, no para memorizar de golpe", "Todo este diccionario se ha guardado directamente en la Enciclopedia del sitio, sin necesidad de darle like término a término"], "content_md": "## De qué va\nUn diccionario de términos de IA pensado específicamente para diseñadoras, escrito por una diseñadora. No es para memorizar: cada término explica cuándo te lo vas a encontrar y por qué importa para tu forma de trabajar con IA.\n\n## Cómo está organizado\n- **Empieza aquí** — los términos que te vas a encontrar en tu primera semana trabajando con herramientas de IA: CLI, Terminal, API, MCP, prompt engineering, ventana de contexto, alucinaciones, LLM, GPT, Markdown, JSON, Artifacts, system prompt.\n- **Nivel 2** — lo que va apareciendo según profundizas: entorno de desarrollo, npm, Git, GitHub, frameworks, frontend vs backend, despliegue, variables de entorno, tokens, agéntico, modelo, multimodal, SVG, debug, y más.\n- **Términos avanzados** — infraestructura y conceptos con los que puedes llegar lejos sin conocerlos, pero que acabas encontrando si sigues profundizando: fork, branch, RAG, fine-tuning, embeddings, servidor, dominio, DNS, SSL, Skills y Proyectos de Claude.\n\n## Por qué le importa a un product designer\nCada entrada trae la 'traducción a lenguaje de diseño': por ejemplo, un repositorio de GitHub se explica como 'el historial de versiones de Figma, pero rastreando también la carpeta de assets y las notas de desarrollo'. Esa capa de traducción es lo que hace que términos que suenan intimidantes dejen de serlo, y es justo el tipo de vocabulario que ayuda a hablar con ingeniería sin sentir que falta contexto.\n\nTodos los términos de este diccionario se han incorporado directamente a la sección Enciclopedia del sitio (no hace falta darles like uno a uno, como con el resto de artículos) — piénsalo como el diccionario de cabecera al que puedes volver en cualquier momento.\n\n## Ideas clave\n- El diccionario cubre 63 términos en tres niveles de profundidad, de lo esencial a lo avanzado.\n- Cada término incluye cuándo lo verás, su traducción a lenguaje de diseño, y por qué importa para tu flujo de trabajo con IA.\n- No hace falta memorizarlo: es una referencia para volver cuando te encuentres una palabra nueva.\n- Todos sus términos ya están en la Enciclopedia del sitio de forma automática.", "images": ["images/diccionario-de-ia-para-disenadores/cover.svg"], "glossary": [{"term": "CLI (Command Line Interface)", "definition": "Una forma de controlar el ordenador escribiendo comandos en vez de haciendo clic. Es donde viven Claude Code y los servidores MCP — no hace falta dominarla, pero conocer lo básico abre puertas."}, {"term": "Terminal", "definition": "La aplicación donde escribes comandos de CLI (Terminal en Mac, PowerShell en Windows). Es como abrir un archivo de Figma en blanco: no pasa nada hasta que tú haces algo."}, {"term": "API (Application Programming Interface)", "definition": "La forma en que dos programas se hablan entre sí: uno pide algo, el otro lo devuelve. Un servidor MCP es, en el fondo, Claude hablando con tus otras apps a través de sus APIs."}, {"term": "MCP (Model Context Protocol)", "definition": "La conexión que deja a Claude ver e interactuar directamente con herramientas como Figma o Notion, en vez de que tengas que describírselas con palabras. Es lo que hace que un flujo de diseño-a-código funcione de verdad."}, {"term": "Prompt engineering", "definition": "La habilidad de escribir instrucciones claras y específicas para que Claude haga justo lo que quieres — como escribir un buen brief de diseño: uno vago da resultados vagos."}, {"term": "Context window (ventana de contexto)", "definition": "Cuánta información puede 'ver' Claude a la vez: la conversación, los archivos, las instrucciones. Si Claude empieza a 'olvidar' cosas de antes, has llenado la ventana de contexto."}, {"term": "Hallucination (alucinación)", "definition": "Cuando la IA afirma algo completamente falso con total seguridad. Conviene verificar siempre los datos que de verdad importan, sobre todo en documentación o afirmaciones técnicas."}, {"term": "LLM (Large Language Model)", "definition": "La familia de IA que hace funcionar a Claude, ChatGPT y similares, entrenada con muchísimo texto para entender y generar lenguaje. Se les da bien el lenguaje, no tanto las matemáticas o los datos en tiempo real."}, {"term": "GPT (Generative Pre-trained Transformer)", "definition": "Un modelo concreto creado por OpenAI, no un término genérico para toda la IA (aunque se use así coloquialmente). Claude NO es un GPT: es un modelo distinto, de Anthropic."}, {"term": "Markdown", "definition": "Una forma sencilla de dar formato a texto con símbolos (# para títulos, ** para negrita, - para listas). Claude lo domina de forma nativa, y es también el formato de los archivos SKILL.md."}, {"term": "JSON (JavaScript Object Notation)", "definition": "Un formato de datos estructurado, con etiquetas y valores entre llaves. Los design tokens, las respuestas de una API o los archivos de configuración suelen venir en este formato."}, {"term": "Artifacts", "definition": "Los resultados interactivos que Claude puede crear —webs, código, documentos— que aparecen en un panel aparte y se pueden probar en vivo. Es la diferencia entre que Claude te describa algo y que te lo enseñe funcionando."}, {"term": "System prompt", "definition": "Instrucciones ocultas que definen cómo se comporta Claude antes incluso de que empieces a escribir. Es como un brief de diseño que está siempre activo — en Proyectos y en las Skills, básicamente defines el tuyo."}, {"term": "IDE (Integrated Development Environment)", "definition": "Un editor de texto sofisticado para escribir código (VS Code, Cursor). Es el Figma de los desarrolladores: no es solo un lienzo, tiene capas, extensiones y propiedades."}, {"term": "npm (Node Package Manager)", "definition": "Una herramienta que descarga e instala paquetes de código ya escritos por otros, para no construir todo desde cero — como instalar un plugin de Figma, pero para proyectos de código."}, {"term": "Node.js", "definition": "Una forma de ejecutar JavaScript fuera del navegador. Muchos servidores MCP y herramientas de IA están construidos con él, así que tenerlo instalado suele ser un requisito previo."}, {"term": "Git", "definition": "Un sistema que registra cada cambio hecho en el código, para poder volver atrás, colaborar sin pisarse el trabajo y ver quién cambió qué. Es como el historial de versiones de Figma, pero mucho más potente."}, {"term": "GitHub", "definition": "Una web donde se guardan y comparten repositorios de Git — como Google Drive para código, con funciones de colaboración. La mayoría de servidores MCP y herramientas de IA viven ahí."}, {"term": "Repository / Repo", "definition": "La carpeta de un proyecto con todo su historial de cambios, normalmente alojada en GitHub. 'Clonar el repo' significa simplemente descargarlo a tu ordenador."}, {"term": "Clone", "definition": "Descargar una copia de un repositorio de GitHub a tu ordenador — como duplicar un archivo de la Comunidad de Figma a tu propia cuenta."}, {"term": "Localhost", "definition": "Tu propio ordenador actuando como servidor temporal y privado. Cuando pruebas algo que Claude ha construido, primero corre en local, antes de publicarse en ningún sitio."}, {"term": "Framework (React, Next.js, Vue...)", "definition": "Una base de código ya construida que los desarrolladores usan para no empezar de cero — como una plantilla de design system con patrones comunes ya montados. Claude suele generar código en React."}, {"term": "Frontend vs Backend", "definition": "Frontend es lo que ve e interactúa el usuario (la interfaz); backend es lo invisible: servidores, bases de datos, lógica. Como diseñadora con IA trabajas sobre todo en frontend, pero entender la diferencia ayuda a hablar con ingeniería."}, {"term": "Deployment (despliegue)", "definition": "El proceso de sacar código de tu ordenador y ponerlo en internet para que otros lo vean — el equivalente a publicar un prototipo de Figma en vez de dejarlo en borradores."}, {"term": "Vercel / Netlify", "definition": "Plataformas que facilitan el despliegue: conectas tu código y ellas se encargan de ponerlo online. Es el botón de 'publicar' de Framer o Webflow, pero para sitios hechos a medida en código."}, {"term": "Environment variables (variables de entorno)", "definition": "Ajustes secretos guardados fuera del código, como claves de API o contraseñas, para que no queden visibles en los archivos."}, {"term": ".env file", "definition": "El archivo especial, normalmente oculto, donde se guardan las variables de entorno. Nunca se sube a GitHub ni se comparte públicamente."}, {"term": "Tokens (contexto de IA)", "definition": "Las unidades con las que Claude mide el texto (aprox. 1 token = 0,75 palabras). Las conversaciones más largas gastan más tokens — importa sobre todo si usas la API o tienes límites de uso ajustados."}, {"term": "Agentic (agéntico)", "definition": "Cuando la IA puede actuar por su cuenta, no solo responder: navegar, hacer clic, ejecutar código, completar tareas de varios pasos. Es la diferencia entre que alguien te describa un cambio y que lo haga por ti."}, {"term": "Dependencies (dependencias)", "definition": "Otros paquetes de código que necesita tu proyecto para funcionar — como los componentes vinculados a una librería de Figma: si la quitas, algo se rompe."}, {"term": "Build", "definition": "Convertir el código fuente en algo que realmente se pueda ejecutar, como paso previo al despliegue — el equivalente a exportar un diseño de Figma en el formato correcto para desarrollo."}, {"term": "Claude Code vs Claude Desktop", "definition": "Dos formas distintas de usar Claude. Claude Desktop es la app de chat normal; Claude Code vive en la terminal y puede ejecutar comandos, editar archivos y construir proyectos de forma más autónoma."}, {"term": "Computer use", "definition": "Una capacidad de Claude para ver y controlar tu pantalla —hacer clic, rellenar formularios, navegar por apps— como un asistente remoto. Abre la puerta a automatizar tareas repetitivas en cualquier aplicación, no solo en las que tienen API."}, {"term": "Model (modelo de IA)", "definition": "El sistema de IA entrenado que da las respuestas. Claude es un modelo; sus distintas versiones (Opus, Sonnet) tienen capacidades y velocidad distintas, como productos dentro de la misma familia."}, {"term": "Multimodal", "definition": "IA que entiende varios tipos de entrada —texto, imágenes, audio— no solo texto. Para una diseñadora es enorme: puedes compartir capturas y mockups directamente en vez de describirlo todo con palabras."}, {"term": "SVG (Scalable Vector Graphics)", "definition": "Un formato de imagen vectorial escrito en código en vez de píxeles, que escala perfectamente a cualquier tamaño. Claude puede generar SVGs —iconos, ilustraciones— directamente."}, {"term": "CSS variables", "definition": "Valores reutilizables definidos una vez y usados en todo el CSS — el equivalente exacto en código a los design tokens o las variables de Figma."}, {"term": "Debug (depurar)", "definition": "Encontrar y arreglar errores en el código. Cuando el código que genera Claude no funciona, tendrás que depurarlo — y Claude también puede ayudarte a hacerlo si le pegas el error."}, {"term": "Syntax (sintaxis)", "definition": "Las reglas gramaticales de un lenguaje de programación. Si Claude genera código y no funciona, puede deberse a un error de sintaxis."}, {"term": "Boilerplate", "definition": "Código de arranque estándar que hace falta en todo proyecto de cierto tipo — como una plantilla de Figma con tu design system ya montado, para no partir de un archivo en blanco cada vez."}, {"term": "Stack", "definition": "La combinación de tecnologías usada para construir algo (lenguajes, frameworks, herramientas). Decirle a Claude tu stack ('React con Tailwind') ayuda a que genere el código adecuado."}, {"term": "Temperature (temperatura)", "definition": "Un ajuste que controla lo creativa o predecible que es una respuesta de IA: baja temperatura, más predecible; alta, más variada. Es como el nivel de libertad creativa que le das a un brief."}, {"term": "Fork", "definition": "Crear tu propia copia de un repositorio ajeno que sigue conectada al original, para modificarla sin afectar al original — como duplicar un archivo de la Comunidad de Figma manteniendo el enlace de origen."}, {"term": "Branch (rama)", "definition": "Una versión paralela del código donde puedes hacer cambios sin tocar la versión principal, y fusionarla después — como una rama de Figma para explorar una idea sin tocar el archivo principal."}, {"term": "Commit", "definition": "Guardar una instantánea de los cambios de código con un mensaje que describe qué hiciste — como dejar una nota de versión en el historial de Figma."}, {"term": "Push / Pull", "definition": "Push es enviar tus cambios guardados a GitHub; pull es descargar los cambios más recientes de GitHub a tu ordenador."}, {"term": "Config / Configuration file (archivo de configuración)", "definition": "Un archivo con los ajustes de cómo debe comportarse una herramienta o proyecto, normalmente en JSON o YAML — el panel de ajustes de Figma, pero guardado en un archivo."}, {"term": "YAML", "definition": "Un formato de archivos de configuración parecido al JSON pero basado en sangrado en vez de llaves, a menudo más fácil de leer."}, {"term": "RAG (Retrieval Augmented Generation)", "definition": "Una técnica en la que la IA busca información relevante en una base de datos antes de responder, en vez de fiarse solo de lo que aprendió en el entrenamiento — como una biblioteca de referencia que la IA puede consultar antes de contestar."}, {"term": "Fine-tuning (ajuste fino)", "definition": "Entrenar un modelo ya existente con datos adicionales para especializarlo en una tarea concreta, como una formación extra después del entrenamiento base. Es caro y avanzado; para la mayoría, un buen prompting basta."}, {"term": "Embeddings", "definition": "Una forma de convertir texto (o imágenes) en números que capturan su significado, para que cosas parecidas tengan números parecidos y se puedan buscar por significado, no solo por coincidencia exacta."}, {"term": "Vector database (base de datos vectorial)", "definition": "Una base de datos optimizada para guardar y buscar embeddings, encontrando los resultados 'más parecidos' en vez de coincidencias exactas — la infraestructura detrás de la búsqueda semántica."}, {"term": "Inference (inferencia)", "definition": "El momento en que un modelo de IA realmente genera una respuesta, usando lo que aprendió durante el entrenamiento. Cuando le mandas un mensaje a Claude y responde, eso es inferencia."}, {"term": "Server (servidor)", "definition": "Un ordenador que da servicio a otros ordenadores: ejecuta software, guarda datos y responde peticiones. Cuando visitas una web, tu navegador le pide la página a un servidor."}, {"term": "Cloud (la nube)", "definition": "Ordenadores y servicios que corren en internet en vez de en tu máquina — 'en la nube' significa 'en los servidores de otro', como guardar archivos en Google Drive en vez de en tu disco duro."}, {"term": "Docker / Container", "definition": "Una forma de empaquetar una aplicación con todo lo que necesita para funcionar igual en cualquier ordenador. Algunos servidores MCP corren dentro de un contenedor Docker."}, {"term": "Hosting (alojamiento)", "definition": "El servicio que mantiene tu web o aplicación funcionando en un servidor para que la gente pueda acceder a ella — como preguntarte dónde vive tu portfolio (¿Framer? ¿Webflow?)."}, {"term": "Domain (dominio)", "definition": "La dirección legible de una web, como yummy-labs.com, en vez de una serie de números. Se compra a un registrador de dominios."}, {"term": "DNS (Domain Name System)", "definition": "El sistema que traduce nombres de dominio en las direcciones numéricas que entienden los ordenadores — la guía telefónica de internet."}, {"term": "SSL / HTTPS", "definition": "La capa de seguridad que cifra los datos entre tu navegador y una web. El candado y el 'https://' en la URL significan que está activa."}, {"term": "Skills (Claude)", "definition": "Instrucciones personalizadas que le das a Claude en un archivo SKILL.md estructurado, para que se comporte de una forma concreta en tareas específicas — un brief creativo detallado que está siempre activo."}, {"term": "Projects (Claude)", "definition": "Espacios de trabajo en Claude donde puedes fijar instrucciones personalizadas, subir archivos de referencia y mantener contexto a través de conversaciones — como la estructura de equipos de Figma, pero para contexto de IA."}, {"term": "Compile (compilar)", "definition": "Convertir el código fuente en un formato que el ordenador pueda ejecutar, un paso previo necesario en algunos lenguajes — como exportar un diseño de Figma a los assets finales de producción."}], "date_added": "2026-07-12", "dictionary": true}, {"id": "5-trucos-para-que-claude-code-no-te-de-un-diseno-web-generico", "title": "5 trucos para que Claude Code no te dé un diseño web genérico", "url": "https://uxplanet.org/5-tips-to-prevent-generic-web-design-in-claude-code-7cc044760453", "section": "practica", "subsection": "Prompting avanzado", "summary": "Nick Babich explica cómo evitar que Claude Code genere webs con \"cara de IA\": la clave está en montar bien el CLAUDE.md antes de pedirle nada, no en el prompt del momento.", "key_points": ["Invoca la skill 'frontend-design' de Claude en tu CLAUDE.md antes de cualquier código, y en cada sesión — Claude no la usa sola por defecto.", "Dale referencias visuales reales (screenshots de Behance/Dribbble o de tu propia marca) en una carpeta del proyecto: 1 referencia funciona mejor que varias.", "Usa el 'screenshot loop': pide a Claude que capture pantalla de lo que genera, lo compare con tus referencias y corrija mismatches, mínimo dos rondas — así se acerca de verdad al resultado que quieres.", "Escribe una sección de 'Anti-Generic Design Guardrails' en el CLAUDE.md: prohíbe explícitamente los defaults típicos (colores de Tailwind sin personalizar, una sola tipografía, shadow-md, transition-all...) porque son justo lo que delata un diseño hecho por IA.", "Dale también sus assets de marca (logo, paleta, tono de voz) en una carpeta aparte, referenciada en el CLAUDE.md o mencionada directamente en el prompt."], "content_md": "## De qué va\nEl artículo parte de un experimento simple: pedirle a Claude Code una landing page con un prompt suelto da un resultado funcional pero con \"cara de plantilla genérica\". El autor, Nick Babich, propone que el problema no es el modelo sino la falta de contexto — y da 5 ajustes concretos, todos centrados en el archivo `CLAUDE.md` (el archivo de instrucciones que Claude lee al empezar a trabajar en un proyecto), para que el resultado se acerque a un diseño con personalidad real.\n\n## Por qué le importa a un product designer\nEsto es justo el tipo de \"prompting de sistema\" que marca la diferencia entre usar Claude como generador de plantillas o como un colaborador que respeta tu criterio visual. Si alguna vez generas UI con Claude Code (o ves a un ingeniero hacerlo y quieres opinar sobre el resultado), estas guardrails son literalmente una versión en texto de lo que tú ya defines en un design system: paleta propia, tipografía con jerarquía, estados de interacción obligatorios, nada de sombras y grises por defecto.\n\n## Ideas clave\n- El CLAUDE.md es el equivalente a un brief de marca: cuanto más específico, menos \"IA genérica\" sale.\n- La skill 'frontend-design' hay que pedirla explícitamente — no se activa sola.\n- El screenshot loop (generar → capturar → comparar con referencia → corregir, mínimo 2 rondas) es la técnica que más mejora el resultado final, más que el prompt inicial.\n- Las \"Anti-Generic Design Guardrails\" son básicamente una lista de anti-patrones de Tailwind/React que cualquier diseñador reconocería como \"lo de siempre\": bg-white + shadow-md + rounded-lg.", "images": ["images/5-trucos-para-que-claude-code-no-te-de-un-diseno-web-generico/cover.svg"], "glossary": [{"term": "CLAUDE.md", "definition": "Un archivo de texto que pones en la carpeta de tu proyecto y que Claude lee automáticamente al empezar a trabajar en él. Es como el brief que le darías a alguien nuevo en el equipo: objetivos, stack técnico, y reglas que quieres que respete siempre."}, {"term": "Skill (de Claude)", "definition": "Un paquete de instrucciones específicas que le enseña a Claude a hacer bien una tarea concreta (como diseñar frontend). Se activa a demanda — hay que pedírsela, no se usa sola por defecto. Piénsalo como un 'modo experto' que puedes encender."}, {"term": "Tailwind CSS", "definition": "Un sistema de utilidades para escribir estilos en código (en vez de un archivo CSS aparte, se aplican clases cortas directamente en el HTML/JSX, como 'bg-white' o 'shadow-md'). Muy usado en desarrollo web moderno; su problema es que, sin personalizar, todo el mundo acaba con la misma pinta 'de fábrica'."}, {"term": "JSX", "definition": "La forma de escribir código en React que mezcla HTML y lógica de programación en el mismo archivo. Es lo que ves si abres el código de una interfaz hecha con React: se parece a HTML pero dentro de JavaScript."}, {"term": "Design tokens", "definition": "Los valores base de un sistema de diseño (colores, tipografías, espaciados) guardados como variables con nombre propio, en vez de usar valores sueltos. Es el mismo concepto que los 'styles' o 'variables' que ya usas en Figma, pero aplicado directamente en el código."}], "date_added": "2026-07-13", "dictionary": false}, {"id": "la-ley-de-pragnanz-el-buen-diseno-es-quitar-no-anadir", "title": "La Ley de Prägnanz: el buen diseño es quitar, no añadir", "url": "https://www.linkedin.com/posts/zanderwhitehurst_ux-ui-design-ugcPost-7480575353086906368-q0i7", "section": "teoria", "subsection": "Principios de diseño", "summary": "Zander Whitehurst recuerda un principio Gestalt que muchos diseñadores ignoran: ante la complejidad, el cerebro busca simplicidad por defecto, así que añadir más botones, links y opciones va justo en contra de cómo percibimos.", "key_points": ["La Ley de Prägnanz es un principio de la psicología Gestalt: el cerebro interpreta formas complejas de la manera más simple posible", "Los diseñadores tienden a resolver la complejidad añadiendo (más botones, más links, más features, más opciones), cuando el cerebro va en la dirección contraria", "Buen diseño no es sumar elementos, es quitar todo lo que se interpone entre el usuario y lo que necesita hacer", "El mismo problema aparece al generar UI con Claude Code: sin guardrails explícitos, tiende a añadir de más en vez de simplificar (ver el artículo de los 5 trucos anti-diseño-genérico)"], "content_md": "## De qué va\nUn post corto de Zander Whitehurst (fundador de Memorisely) que resume un principio de diseño que se olvida fácil: la Ley de Prägnanz. Viene de la psicología Gestalt y dice que, ante algo visualmente complejo, el cerebro lo interpreta de la forma más simple posible — busca patrones simples aunque el objeto real sea complicado. La consecuencia para diseño: cuando algo se siente complicado de usar, la reacción instintiva de un equipo suele ser añadir (un botón más, un link más, una opción más para cubrir el caso raro), pero eso va justo en la dirección contraria a como percibimos. El buen diseño no es sumar, es quitar todo lo que se interpone entre la persona y lo que quiere hacer.\n\n## Por qué le importa a un product designer\nEste principio no es solo una frase bonita de LinkedIn: es literalmente la base de por qué la sobrecarga de opciones cansa aunque cada opción individual tenga sentido. Y conecta directo con algo que ya viste en el artículo de los '5 trucos para que Claude Code no te dé un diseño web genérico': una de las trampas más comunes al generar UI con IA es que, sin guardrails explícitos, el modelo tiende a añadir de más (sombras, variantes, elementos decorativos) en vez de aplicar este mismo criterio de simplicidad. La Ley de Prägnanz es, en el fondo, el argumento de por qué merece la pena poner ese límite explícito.\n\n## Ideas clave\n- La Ley de Prägnanz (psicología Gestalt): el cerebro interpreta lo complejo de la forma más simple posible.\n- Cuando algo se siente complicado, la respuesta instintiva de añadir (botones, links, opciones) va en contra de cómo percibimos.\n- Diseñar bien es un ejercicio de quitar, no de sumar.\n- El mismo patrón aparece al generar UI con IA: sin límites explícitos, tiende a añadir de más en vez de simplificar.", "images": ["images/la-ley-de-pragnanz-el-buen-diseno-es-quitar-no-anadir/cover.png"], "glossary": [{"term": "Ley de Prägnanz (Gestalt)", "definition": "Un principio de percepción que dice que el cerebro, ante algo visualmente complejo, lo interpreta de la forma más simple y ordenada posible — no procesamos el detalle completo, buscamos el patrón más sencillo que explique lo que vemos. Es la base científica de por qué las interfaces sobrecargadas de opciones cansan, aunque cada opción por separado tenga sentido."}], "date_added": "2026-07-14", "dictionary": false, "annotations": [{"quote": "El buen diseño no es sumar, es quitar todo lo que se interpone entre la persona y lo que quiere hacer.", "type": "ejemplo", "text": "Ejercicio de 10 minutos: coge una pantalla real tuya de esta semana y cuenta cuántos elementos compiten por atención arriba (título, subtítulo, badge, icono, breadcrumb, botón secundario...). Ve uno a uno preguntando 'si quito esto, ¿la persona deja de entender qué hacer?'. Todo lo que sobrevive a esa pregunta se queda; el resto fuera. No es rediseñar, es solo restar — casi siempre el recuento baja a la mitad sin perder nada funcional.", "date": "2026-08-18"}]}, {"id": "designmd-buenas-practicas-para-el-archivo-que-le-da-a-la-ia-tu-sistema", "title": "DESIGN.md: buenas prácticas para el archivo que le da a la IA tu sistema de diseño", "url": "https://uxplanet.org/design-md-best-practices-c00325e8b23a", "section": "novedades", "subsection": "Design systems + IA", "summary": "Nick Babich explica DESIGN.md, el archivo que le da a un agente de IA (Google Stitch, Claude Code, Cursor) tu sistema de diseño real —tokens, reglas, estados— en vez de dejarle inventar estilos genéricos. Es, en la práctica, el hermano de diseño del CLAUDE.md.", "key_points": ["DESIGN.md nació en Google Stitch y se abrió como especificación de archivo, reutilizable en cualquier herramienta de IA para diseño/código", "Tiene dos capas: un frontmatter YAML con el nombre del sistema y los design tokens (colores, tipografía, radios, spacing), y un cuerpo en Markdown que explica marca, estilos y componentes", "Regla 1: los tokens son decisiones, no solo variables — nómbralos por el rol que cumplen (primary, surface-dim) no por su aspecto (blue, gray-1)", "Regla 2: cada decisión de diseño necesita razonamiento — valor → intención de uso → por qué → cuándo NO usarlo (los límites son tan importantes como el uso)", "Regla 3: los componentes se construyen encima de los tokens y el razonamiento ya definidos, y deben cubrir todos los estados (default, hover, active, disabled, loading, focus), no solo el estado por defecto"], "content_md": "## De qué va\nNick Babich (el mismo autor de los '5 trucos para que Claude Code no te dé un diseño genérico') explica DESIGN.md: un archivo de texto plano que describe la identidad visual de tu producto y le da a un agente de IA contexto persistente y estructurado sobre cómo debe verse y sentirse. Nació en Google Stitch y se abrió como especificación, así que sirve igual en Claude Code, Cursor o cualquier otra herramienta de IA para diseño.\n\nEl archivo tiene dos capas: un frontmatter en YAML con el nombre del sistema de diseño y los design tokens (colores, tipografía, radios de esquina, spacing), y un cuerpo en Markdown que desarrolla marca, estilos y componentes conectando cada explicación con los tokens definidos arriba.\n\n## DESIGN.md es el hermano de diseño de CLAUDE.md\nSi ya viste el artículo de los 5 trucos anti-diseño-genérico, esto te va a sonar: CLAUDE.md son las reglas de comportamiento que le pones a Claude Code antes de generar nada (qué evitar, qué screenshot loop seguir). DESIGN.md es el complemento específico de diseño — en vez de reglas de proceso, es el sistema de diseño real (tus tokens, tu marca, tus componentes) puesto en un formato que la IA puede leer directamente en vez de inventar valores por defecto. Usados juntos, uno cubre el 'cómo te comportas' y el otro el 'con qué material trabajas'.\n\n## Las 3 reglas para escribir un buen DESIGN.md\n1. **Los tokens son decisiones, no solo variables.** Nombrar un color 'primary' no es solo ponerle nombre a un HEX, es definir qué rol cumple en la interfaz. Evita nombres por aspecto (`blue`, `gray-1`) y usa nombres por rol (`primary`, `surface-dim`, `border-subtle`, `radius-card`) — así la IA entiende la función, no solo el valor.\n2. **Toda decisión necesita razonamiento.** La secuencia es: valor bruto (el HEX) → intención de uso (para qué sirve) → razonamiento (por qué) → límites (cuándo NO usarlo). Ese último punto —los límites— es el que más se olvida, y es justo el que evita que la IA use tu color de marca en sitios donde no toca.\n3. **Los componentes se construyen encima de los tokens y el razonamiento.** No basta con describir el estado por defecto de un botón: hace falta cubrir default, hover, active, disabled, loading y focus, porque son justo los estados que una IA sin esa guía tiende a olvidar o inventar mal.\n\n## Por qué le importa a un product designer\nEsto es la versión escrita de algo que ya haces mentalmente al mantener un design system: nombrar por rol, justificar decisiones, cubrir todos los estados. La diferencia es que aquí ese criterio se pone en un archivo que la IA puede leer literalmente antes de generar nada, en vez de tener que repetírselo en cada prompt. Cuanto más se parezca tu DESIGN.md a cómo ya piensas un sistema de diseño, menos genérico va a salir lo que te construya Claude Code, Cursor o Stitch.\n\n## Ideas clave\n- DESIGN.md le da a la IA tu sistema de diseño real (tokens, marca, componentes) en vez de dejarle inventar estilos por defecto.\n- Es el complemento de diseño del CLAUDE.md: uno cubre el comportamiento, el otro el material visual.\n- Nombra los tokens por el rol que cumplen, no por su aspecto.\n- Cada decisión necesita razonamiento, y sobre todo límites: cuándo NO usar algo.\n- Los componentes deben cubrir todos los estados, no solo el default.", "images": ["images/designmd-buenas-practicas-para-el-archivo-que-le-da-a-la-ia-tu-sistema/cover.svg"], "glossary": [{"term": "YAML frontmatter", "definition": "Un bloque de configuración al principio de un archivo de texto, delimitado por '---', escrito en formato YAML (parecido al JSON pero con sangrado en vez de llaves). En DESIGN.md es donde van los design tokens; en las Skills de Claude es donde va el nombre y la descripción. Piénsalo como el panel de ajustes del archivo, separado del contenido narrativo de abajo."}, {"term": "Google Stitch", "definition": "Una herramienta de Google que genera UI a partir de un sistema de diseño, y donde nació el formato DESIGN.md. No hace falta usarla para aprovechar la idea: el formato se abrió como especificación reutilizable en cualquier herramienta de IA para diseño, incluido Claude Code."}], "date_added": "2026-07-14", "dictionary": false}, {"id": "taste-skill-el-framework-anti-slop-para-que-tu-agente-de-ia-tenga-buen", "title": "Taste Skill: el framework anti-slop para que tu agente de IA tenga buen gusto", "url": "https://www.tasteskill.dev/", "section": "novedades", "subsection": "Skills anti-diseño-genérico", "summary": "Un set de 13 skills open-source instalables con un comando que le enseñan a Claude Code, Cursor, Codex y otros agentes a no generar frontends genéricos: infieren el brief, mapean a sistemas de diseño reales y pasan un checklist antes de entregar.", "key_points": ["Taste Skill es un conjunto de archivos SKILL.md open-source, instalables con `npx skills add Leonxlnx/taste-skill`, compatibles con Claude Code, Cursor, Codex, Gemini CLI, v0, Lovable y más", "No es una sola skill: son 13 pensadas para casos distintos (estilo visual, rediseño de proyectos existentes, exportar a DESIGN.md, generación de imágenes de referencia...)", "La v2 (experimental, ya el default) lee el brief antes de generar, sabe cuándo usar un sistema de diseño real (Material, Fluent, Carbon, Radix, shadcn) en vez de inventar uno, y pasa un checklist obligatorio antes de entregar", "Es el mismo problema que ya viste en los '5 trucos para Claude Code' y en DESIGN.md, pero empaquetado y mantenido por otros en vez de escrito desde cero"], "content_md": "## De qué va\nTaste Skill empaqueta, en forma de skills instalables, el mismo problema que ya conoces de los '5 trucos para Claude Code' y de DESIGN.md: por defecto, los agentes de IA tienden a generar frontends genéricos ('slop', en la jerga del proyecto). En vez de escribir tú las reglas anti-genéricas a mano, aquí vienen ya escritas y mantenidas, listas para instalar en cualquier agente compatible con archivos SKILL.md.\n\n## Por qué le importa a un product designer\nEs la versión 'lista para instalar' de un criterio que ya tienes: sin guardrails explícitos, la IA genera diseño con cara de IA. La diferencia con tu propio CLAUDE.md o DESIGN.md es que aquí alguien más ya investigó qué reglas funcionan para qué casos, y las mantiene actualizadas (tiene changelog). Vale la pena tenerlo como referencia de qué reglas concretas usar, aunque acabes adaptando las tuyas a tu propia marca.", "images": ["images/taste-skill-el-framework-anti-slop-para-que-tu-agente-de-ia-tenga-buen/cover.svg"], "glossary": [{"term": "npx", "definition": "Un comando que descarga y ejecuta un paquete de código una sola vez, sin instalarlo permanentemente en tu ordenador — a diferencia de `npm install`, que sí lo deja instalado. Es la forma más rápida de 'probar' o 'añadir' algo como una skill sin montar nada a mano."}, {"term": "AI slop", "definition": "Término coloquial para el resultado genérico y de baja calidad que produce la IA cuando no se le dan suficientes límites o criterio: el mismo patrón visual repetido, colores por defecto, sensación de plantilla. Es lo contrario de lo que buscan guardrails como CLAUDE.md, DESIGN.md o Taste Skill."}], "materials": [{"name": "taste-skill", "tag": "Principal · v2", "description": "Lee el brief, infiere la dirección de diseño correcta y evita interfaces con cara de plantilla. Usa sistemas de diseño reales cuando toca y pasa un checklist antes de entregar.", "install": "npx skills add Leonxlnx/taste-skill --skill design-taste-frontend", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/taste-skill"}, {"name": "taste-skill-v1", "tag": "Legacy", "description": "La v1 original, conservada para proyectos que dependen de su comportamiento exacto. Úsala solo si v2 rompe algo específico.", "install": "npx skills add Leonxlnx/taste-skill --skill design-taste-frontend-v1", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/taste-skill-v1"}, {"name": "gpt-tasteskill", "tag": "GPT / Codex", "description": "Variante más estricta para modelos de GPT y Codex, con más variación de layout y dirección de movimiento.", "install": "npx skills add Leonxlnx/taste-skill --skill gpt-tasteskill", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/gpt-tasteskill"}, {"name": "image-to-code-skill", "tag": "Image-first", "description": "Genera referencias visuales primero, las analiza en profundidad, y luego implementa el frontend siguiéndolas de cerca.", "install": "npx skills add Leonxlnx/taste-skill --skill image-to-code-skill", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/image-to-code-skill"}, {"name": "redesign-skill", "tag": "Auditoría", "description": "Para proyectos existentes que necesitan una auditoría visual seria y un rediseño más limpio, no partir de cero.", "install": "npx skills add Leonxlnx/taste-skill --skill redesign-skill", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/redesign-skill"}, {"name": "soft-skill", "tag": "Estilo visual", "description": "Interfaces calmadas y de aspecto caro: contraste suave, mucho whitespace, movimiento fluido.", "install": "npx skills add Leonxlnx/taste-skill --skill soft-skill", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/soft-skill"}, {"name": "output-skill", "tag": "Ejecución", "description": "Evita resultados a medias: bloquea placeholders, secciones saltadas o trabajo sin terminar.", "install": "npx skills add Leonxlnx/taste-skill --skill output-skill", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/output-skill"}, {"name": "minimalist-skill", "tag": "Estilo visual", "description": "UI de producto editorial y limpia: color contenido, estructura marcada, jerarquía más ajustada.", "install": "npx skills add Leonxlnx/taste-skill --skill minimalist-skill", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/minimalist-skill"}, {"name": "brutalist-skill", "tag": "Estilo visual", "description": "Lenguaje visual mecánico y duro: tipografía suiza, estructura cruda, contraste marcado.", "install": "npx skills add Leonxlnx/taste-skill --skill brutalist-skill", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/brutalist-skill"}, {"name": "stitch-skill", "tag": "Exportar", "description": "Reglas de diseño semánticas compatibles con Google Stitch, con un formato extra de exportación a DESIGN.md.", "install": "npx skills add Leonxlnx/taste-skill --skill stitch-skill", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/stitch-skill"}, {"name": "imagegen-frontend-web", "tag": "Image gen", "description": "Imágenes de referencia de nivel 'premium' para webs: dirección de arte fuerte, tipografía, spacing, disciplina anti-slop.", "install": "npx skills add Leonxlnx/taste-skill --skill imagegen-frontend-web", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/imagegen-frontend-web"}, {"name": "imagegen-frontend-mobile", "tag": "Image gen", "description": "Conceptos de pantallas móviles y flujos completos, con jerarquía limpia y consistencia entre pantallas.", "install": "npx skills add Leonxlnx/taste-skill --skill imagegen-frontend-mobile", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/imagegen-frontend-mobile"}, {"name": "brandkit", "tag": "Image gen", "description": "Imágenes resumen de brand kit: conceptos de logo, sistema de color, tipografía y mockups.", "install": "npx skills add Leonxlnx/taste-skill --skill brandkit", "url": "https://github.com/Leonxlnx/taste-skill/tree/main/skills/brandkit"}], "date_added": "2026-07-14", "dictionary": false}, {"id": "el-loop-de-2-niveles-para-que-claude-deje-de-autopuntuarse-su-propio-d", "title": "El loop de 2 niveles para que Claude deje de autopuntuarse su propio diseño", "url": "https://www.linkedin.com/posts/carmenerincon_hey-designers-todays-is-a-slightly-share-7483122441939058688-KocS", "section": "practica", "subsection": "Evaluación de diseño con Claude Code", "summary": "Carmen Rincon explica por qué dejar que Claude revise su propio diseño no sirve (sesgo de autopreferencia) y monta un loop de dos niveles en Claude Code: un panel de agentes críticos ciegos que puntúan por separado, más una capa de memoria para que no repita los mismos fallos sesión tras sesión.", "key_points": ["No dejes que Claude revise su propio trabajo: cuando evalúa lo que acaba de construir, lo defiende — lee lo que quiso hacer, no lo que hay realmente en pantalla (sesgo de autopreferencia)", "El coste es real: en un build de cliente, Claude se puntuó a sí mismo 75/100; un panel ciego que no había construido esa pantalla puntuó el mismo trabajo un 52 — 23 puntos de diferencia", "Nivel 1, el panel de críticos: agentes separados, cada uno en su propio contexto (así ninguno puede defender lo construido), cada uno dueño de una lente: craft+marca+fidelidad, UX+accesibilidad+motion, tokens+código+contenido, oportunidad/mejora", "Puntúan a ciegas contra una rúbrica pensada al revés de lo normal: se pondera más lo que Claude hace peor (gusto, coherencia, craft) que lo que ya hace bien (layout, viabilidad técnica) — así la revisión es útil, no un aplauso", "Nivel 2, la memoria: los fallos detectados se guardan y se recargan en cada sesión nueva, así los mismos errores (contraste, colores fuera de sistema, el mismo fallo de spacing) no vuelven a aparecer, y la puntuación sube de loop en loop en vez de resetear cada vez"], "content_md": "## De qué va\nCarmen Rincon (co-fundadora de Yummy Labs, la misma fuente de los artículos que ya tienes sobre dónde va tu contexto en Claude y por qué los diseñadores gastan su límite de uso más rápido) explica un problema muy concreto: pedirle a Claude que revise el propio diseño que acaba de generar no funciona, porque cuando evalúa su propio trabajo lo defiende. Lee lo que *quiso* construir, no lo que realmente hay en pantalla — es el mismo motivo por el que no puedes corregir bien tu propio texto recién escrito. Tiene nombre: sesgo de autopreferencia (self-preferential bias).\n\nLa diferencia de puntuación que midió en un proyecto real de cliente es la prueba: Claude se puntuó a sí mismo un 75 sobre 100 en una pantalla; un panel ciego que no había construido esa pantalla puntuó exactamente el mismo trabajo un 52. 23 puntos de diferencia sobre lo mismo.\n\n## El loop de dos niveles en Claude Code\n**Nivel 1 — el panel de críticos.** En vez de que el mismo Claude que construyó la pantalla la revise, se lanzan varios agentes críticos separados, cada uno en su propio contexto (así ninguno ha visto el proceso de construcción y no puede defenderlo). Cada agente es dueño de una única lente:\n- craft + marca + fidelidad\n- UX + accesibilidad + motion\n- tokens + código + contenido\n- oportunidad / mejora\n\nPuntúan a ciegas contra una rúbrica — y aquí está el truco que casi nadie hace: la rúbrica se pondera hacia lo que Claude hace *peor*, no hacia lo que ya hace bien. Layout y viabilidad técnica ya se le dan razonablemente bien, así que pesan menos; gusto, coherencia y craft son sus puntos débiles, así que pesan más. Eso es lo que convierte la revisión en algo útil de verdad, en vez de un halago disfrazado de evaluación.\n\n**Nivel 2 — la memoria.** Los fallos detectados en el panel se guardan y se recargan cada sesión nueva, así Claude deja de repetirlos: los mismos fallos de contraste, los mismos colores fuera del sistema, el mismo error de spacing no vuelven a aparecer. La siguiente pantalla arranca más alto, y la puntuación sube de loop en loop en vez de resetear cada vez que empiezas una sesión nueva.\n\n## Por qué le importa a un product designer\nEste panel de críticos es, en el fondo, el mismo patrón de subagentes que ya viste en el artículo de 'Claude Agents': un trabajo con un objetivo claro, herramientas acotadas (aquí, de solo lectura — mirar y puntuar, nunca tocar) y límites bien definidos, aplicado en concreto a resolver el problema de que nadie se marca bien sus propios deberes. La idea de que la rúbrica debe pesar más hacia los puntos débiles del modelo, no hacia los fuertes, es aplicable más allá de este caso: cualquier sistema de revisión (humano o IA) es más útil cuando se diseña para encontrar lo que de verdad se le escapa a quien construyó, no para confirmar lo que ya sabía hacer bien.\n\n## Ideas clave\n- No dejes que Claude revise su propio trabajo: lo defiende por sesgo de autopreferencia, igual que tú no puedes corregir bien tu propio texto recién escrito.\n- Diferencia medida en un proyecto real: 75/100 autopuntuado vs. 52/100 por un panel ciego — 23 puntos de distancia sobre el mismo trabajo.\n- Nivel 1: agentes críticos separados, cada uno en su propio contexto y con una sola lente, puntuando a ciegas contra una rúbrica ponderada hacia los puntos débiles del modelo.\n- Nivel 2: los fallos se guardan y se recargan cada sesión, así la puntuación mejora acumulativamente en vez de resetear.\n- Es el mismo patrón de subagentes de 'Claude Agents', aplicado a que nadie se corrija bien sus propios deberes.", "images": ["images/el-loop-de-2-niveles-para-que-claude-deje-de-autopuntuarse-su-propio-d/cover.png"], "glossary": [{"term": "Sesgo de autopreferencia (self-preferential bias)", "definition": "La tendencia a valorar mejor algo que tú mismo has hecho, porque cuando lo revisas recuerdas la intención con la que lo construiste, no solo lo que realmente quedó. Es la razón por la que revisar tu propio trabajo (de texto, de código, o de diseño) da resultados más generosos que cuando lo revisa alguien que no lo construyó."}, {"term": "Evaluación ciega (blind review)", "definition": "Un proceso de revisión donde quien evalúa no sabe (o no ha visto) quién o cómo se construyó lo que está puntuando, para que no pueda inclinarse a favor de ello. En este caso, los agentes críticos evalúan la pantalla sin haber participado en construirla, así puntúan desde cero en vez de simplemente confirmar el trabajo."}], "materials": [], "date_added": "2026-07-15", "dictionary": false, "annotations": [{"quote": "se lanzan varios agentes críticos separados, cada uno en su propio contexto (así ninguno ha visto el proceso de construcción y no puede defenderlo)", "type": "ampliacion", "text": "Un agente crítico separado es una conversación nueva e independiente con Claude — sin el historial de cómo se construyó el diseño — con un prompt de sistema propio (una sola lente: p. ej. solo craft+marca, o solo UX+accesibilidad), herramientas de solo lectura (puede mirar, no tocar) y la misma rúbrica. En Claude Code se lanzan como subagentes en paralelo; por API, como llamadas independientes sin el hilo de conversación anterior. Es el mismo patrón de subagentes del artículo Claude Agents, aplicado a evaluación en vez de construcción.", "date": "2026-08-17"}, {"quote": "Los fallos detectados en el panel se guardan y se recargan cada sesión nueva", "type": "ampliacion", "text": "El panel es el mismo panel de críticos del Nivel 1 — el grupo de agentes que puntúan el diseño. Nivel 2 no es un panel nuevo: es la memoria que recuerda, sesión tras sesión, lo que ese panel encontró mal.", "date": "2026-08-17"}, {"quote": "los mismos fallos de contraste, los mismos colores fuera del sistema, el mismo error de spacing no vuelven a aparecer", "type": "ejemplo", "text": "Ejemplo: el Crítico de UX+accesibilidad puntúa bajo un botón por falta de contraste → ese fallo concreto se guarda como entrada de memoria → en la siguiente sesión, Claude ya lo tiene presente y no lo repite. Es memoria de fallos objetivos detectados contra la rúbrica, no de preferencias estéticas personales.", "date": "2026-08-17"}, {"quote": "Este panel de críticos es, en el fondo, el mismo patrón de subagentes que ya viste en el artículo de 'Claude Agents'", "type": "ampliacion", "text": "Panel de críticos = consejo de críticos = los agentes del Nivel 1. El artículo <a href=\"#/articulo/claude-agents-que-son-y-como-crear-uno\">Claude Agents: qué son y cómo crear uno</a> explica la idea central: un agente no es algo técnico, es un trabajo que tú diseñas — le das un objetivo, unas herramientas y unos límites, y es Claude quien decide los pasos (a diferencia de una task o un workflow, donde decides tú). Cada crítico del panel es exactamente eso: un objetivo claro (puntuar una lente concreta), herramientas acotadas (solo lectura — mirar y puntuar, nunca tocar) y límites definidos (su rúbrica). Y hay un motivo de fondo por el que esto le importa especialmente a un product designer: cuando el criterio de revisión vive en un agente compartido del proyecto — no en la cabeza de la persona senior que sabe verlo — deja de depender de que esa persona esté presente, y se convierte en un estándar versionado que se aplica igual a cada pantalla.", "date": "2026-08-17"}, {"quote": "se lanzan varios agentes críticos separados, cada uno en su propio contexto (así ninguno ha visto el proceso de construcción y no puede defenderlo)", "type": "ejemplo", "text": "Caso real: generas una pantalla y lanzas 4 evaluaciones en paralelo, cada una viendo solo el screenshot final + la rúbrica, nunca el proceso de construcción — Crítico 1 solo mira craft+marca+fidelidad, Crítico 2 solo UX+accesibilidad+motion, Crítico 3 solo tokens+código+contenido, Crítico 4 solo oportunidad/mejora. Ninguno puede tocar nada, solo puntuar. Sus 4 notas se combinan (ponderadas hacia los puntos débiles) en la puntuación final — la del ejemplo del artículo: 52/100 frente al 75/100 que se había puesto Claude a sí mismo.", "date": "2026-08-17"}, {"quote": "Este panel de críticos es, en el fondo, el mismo patrón de subagentes que ya viste en el artículo de 'Claude Agents'", "type": "ejemplo", "text": "Aplicado a tu día a día: en vez de pedirle a Claude \"revisa esta pantalla\", montas 4 prompts de sistema fijos (uno por lente) que guardas en el proyecto, no en tu cabeza. Cualquiera del equipo que use ese proyecto compartido obtiene la misma revisión, con los mismos criterios, aunque tú no estés delante — deja de depender de que la persona senior \"lo vea a ojo\".", "date": "2026-08-17"}]}, {"id": "claudemd-el-proceso-paso-a-paso-para-crear-el-tuyo", "title": "CLAUDE.md: el proceso paso a paso para crear el tuyo", "url": "", "section": "practica", "subsection": "Claude Code", "summary": "Un workflow práctico para crear tu propio CLAUDE.md — el archivo que Claude Code lee automáticamente al principio de cada sesión en un proyecto. La idea central: no se escribe de memoria ni de golpe, se construye por entrevista guiada, con un prompt de arranque, una checklist de revisión y una plantilla lista para copiar.", "key_points": ["CLAUDE.md se carga automáticamente al principio de cada sesión de Claude Code en ese proyecto — por eso tiene que ser corto (40–80 líneas ideal, 150 máximo)", "Se construye por entrevista, con un prompt de arranque concreto para pegar en Claude Code", "Las preguntas cubren cinco bloques: proyecto, preferencias de diseño, arquitectura, tono/contenido y restricciones", "Incluye una checklist de revisión antes de guardar, y una plantilla lista para copiar", "El sistema de diseño (tokens, marca, componentes) va mejor en su propio archivo — ver DESIGN.md — con solo un puntero desde el CLAUDE.md", "Se mantiene vivo: se revisa cuando Claude repite un error, cambia la estructura del proyecto, o el archivo crece por encima de las 150 líneas"], "content_md": "## De qué va\nUn workflow práctico (parte del curso \"Claude Code for Designers\") para crear tu propio CLAUDE.md: el archivo que Claude Code lee automáticamente al principio de cada sesión en un proyecto, y que le da el contexto que si no tendrías que repetir cada vez — qué es el proyecto, tus preferencias de diseño, cómo está organizado, y qué no tocar. La idea central: no lo escribas de memoria ni de golpe. Se construye respondiendo a una entrevista guiada, con reglas concretas sobre lo que hace que un CLAUDE.md funcione de verdad en vez de ser ruido que Claude acaba ignorando.\n\n## Cuándo usar esto\n- Ya has empezado a construir algo en Claude Code y los resultados se sienten demasiado genéricos.\n- Estás montando una carpeta de proyecto nueva por primera vez.\n- Quieres que Claude siga tus preferencias de diseño y el contexto del proyecto de forma consistente.\n- Un compañero va a usar el mismo proyecto de Claude Code y necesita el mismo contexto compartido.\n\n**Cuándo NO usarlo todavía:** si es tu primera vez con Claude Code, explora y construye algo primero. Monta el CLAUDE.md una vez tengas una idea de qué decisiones se repiten.\n\n## Las reglas antes de escribir nada\n- **40–80 líneas ideal, máximo ~150.** Se carga en cada sesión — demasiado largo y Claude empieza a \"olvidar\" lo del medio (context rot), o directamente lo ignora.\n- **Es un índice, no una enciclopedia.** Mantenlo corto y señala a otros archivos para el detalle (\"Para tokens → lee tokens.md\") en vez de meterlo todo dentro.\n- **Solo Markdown.** Es eficiente en tokens; un PDF gasta contexto solo en metadatos.\n- **Qué + Por qué + Cómo.** Esa es la estructura mínima: qué es esto, por qué existe, cómo está organizado.\n- **El sistema de diseño va aquí, no en una Skill.** Las Skills hay que invocarlas explícitamente; el CLAUDE.md se carga solo — resérvalo para lo que tiene que aplicar siempre.\n- **No dupliques.** Si algo ya vive en otro archivo, señala hacia él — no lo copies dentro.\n\n## Paso 1 — pega este prompt en Claude Code\nAbre una sesión nueva de Claude Code en la carpeta de tu proyecto. Pon el modo de permisos en **Plan Mode**. Luego pega esto tal cual (está en inglés a propósito, es literalmente lo que le vas a dar a Claude):\n\n```\nI want you to help me create a CLAUDE.md file for this project.\n\nCLAUDE.md is a system prompt that you will read at the start of every single conversation in this project. It should give you the context you need to do good work without me having to repeat myself — covering what this project is, why it exists, how it's structured, my design preferences, and any constraints.\n\nPlease interview me to gather what you need. Ask me questions one section at a time — don't dump everything at once. After each answer, ask any follow-up that would help you write that section better.\n\nOnce we've covered everything, draft the full CLAUDE.md file for my review. I'll then tell you what to adjust before we save it.\n\nGround rules for the file you'll create:\n- Keep it between 40 and 80 lines. Maximum 150.\n- Use markdown format only (no PDFs, no long prose blocks)\n- Structure it with clear sections using ## headers\n- If any section would get too long, don't write the full detail — instead write a short pointer: \"For X detail — read [filename].md\" and flag that we should create that file separately\n- The file should cover: project overview, design preferences, architecture/structure, tone and content rules, and any known constraints\n- End with a short \"What NOT to do\" section so you know what to avoid\n\nStart by asking me about the project — what it is and who it's for.\n```\n\n## Paso 2 — responde a las preguntas de Claude\nClaude va a ir sección por sección. Esto es lo que te va a preguntar en cada bloque — tenlo pensado antes de empezar para que la entrevista vaya rápido:\n\n**Sobre el proyecto**\n- ¿Qué es este proyecto, en una frase?\n- ¿Para quién es?\n- ¿Qué problema resuelve?\n- ¿Cómo se ve el éxito?\n\n**Sobre tus preferencias de diseño**\n- ¿Cuál es el lenguaje visual? (minimalista, atrevido, editorial, desenfadado...)\n- Tipografías, si ya las tienes decididas\n- Enfoque de color (p. ej. \"fondo oscuro, un solo color de acento, alto contraste\")\n- Sensación de espaciado (apretado, generoso, estructurado...)\n- Estilo de animación (ninguna, sutil, expresiva...)\n- Referencias — sitios, apps o sensaciones que te parecen acertadas\n\n**Sobre la arquitectura**\n- ¿Qué hay en esta carpeta? ¿Cómo está organizada?\n- ¿Qué stack se está usando? (aunque sea a grandes rasgos — \"Next.js + Tailwind\", \"HTML plano\", \"React\")\n- ¿Dónde viven las API keys / secretos? (p. ej. un archivo .env)\n- ¿Hay archivos que Claude nunca debería tocar?\n\n**Sobre el tono y el contenido**\n- ¿Cuál es la voz de este producto? (profesional, cercana, directa, con filo...)\n- ¿Hay palabras o expresiones que evitar?\n- ¿Quién es quien lee/usa esto — cómo piensa y cómo habla?\n\n**Sobre las restricciones**\n- ¿Requisitos de compatibilidad de navegador?\n- ¿Objetivos de rendimiento?\n- ¿Estándares de accesibilidad?\n- ¿Algo que ya esté decidido y no deba cambiarse?\n\n## Paso 3 — revisa el borrador\nClaude va a producir un borrador. Léelo y pregúntate:\n- ¿Está por debajo de 150 líneas?\n- ¿Se nota cada línea, o hay alguna que no echarías de menos si desapareciera?\n- ¿La sección de preferencias de diseño es lo bastante concreta para guiar decisiones, o sigue siendo vaga?\n- ¿Falta algo que siempre acabas repitiéndole a Claude?\n- ¿Hay algo aquí que Claude no necesita saber en cada sesión?\n\nDile a Claude qué cambiar, siendo específico — algo como *\"la sección de preferencias de diseño es demasiado vaga, añade que usamos 8px de espaciado base e Inter como tipografía principal\"*, no un \"mejóralo\" genérico.\n\n## Paso 4 — guárdalo\nCuando estés a gusto con el resultado, dile a Claude, tal cual:\n\n```\nSave this as CLAUDE.md in the root of this project folder.\n```\n\nListo. A partir de ahí, cualquier sesión nueva en esa carpeta lo carga sola.\n\n## Paso 5 — mantenlo vivo\nUn CLAUDE.md tiene que crecer con el proyecto. Vuelve a él cuando:\n- Has tomado una decisión de diseño que Claude sigue clavando mal.\n- La estructura del proyecto ha cambiado de forma significativa.\n- Has añadido un sistema de diseño o un archivo de tokens (añade un puntero a él).\n- Has creado otros archivos de referencia que Claude debería conocer.\n\nSi se acerca a las 150 líneas, divídelo: mueve la sección más larga a su propio archivo y sustitúyela por un puntero de una línea.\n\n## La plantilla, lista para copiar\nEsta es la forma a la que apuntas — Claude la rellenará con tus respuestas. Se queda en inglés a propósito: es literalmente lo que se pega dentro de tu CLAUDE.md.\n\n```\n# [Project Name]\n\n## Project\n[1–3 sentences: what it is, who it's for, what it's trying to do]\n\n## Design Preferences\n- Layout: [e.g. minimal, generous whitespace, single-column mobile-first]\n- Typography: [font family, scale approach]\n- Colour: [palette description, usage rules]\n- Spacing: [base unit, rhythm]\n- Interactions: [animation style, hover states]\n- Mood / references: [1–2 references or vibes]\n\n## Architecture\n- Stack: [e.g. Next.js 15, Tailwind 4, TypeScript]\n- Folder structure: [brief overview or pointer to a README]\n- API keys: stored in `.env` — never commit this file\n- Do not touch: [any files or folders that are off-limits]\n\n## Design System\n→ See `tokens.md` for colour, spacing, and type tokens\n→ See `components.md` for component rules and variants\n[Or write tokens inline if there's no separate file yet]\n\n## Content & Tone\n- Voice: [e.g. direct, warm, no jargon]\n- Audience: [who they are, how they think]\n- Avoid: [words, patterns, or tones that don't fit]\n\n## Known Constraints\n- [e.g. Must work offline / WCAG AA minimum / No external fonts]\n\n## What NOT to Do\n- Don't invent new design patterns — use what's already established\n- Don't hardcode values — use tokens\n- Don't change [X] without asking first\n- [Any other guardrails specific to this project]\n```\n\n## Por qué le importa a un product designer\nEsto es la versión de proyecto del DESIGN.md que ya viste: si DESIGN.md es tu sistema de diseño real puesto en un formato que la IA puede leer, CLAUDE.md es el resto del contexto del proyecto — quién es el usuario, cómo está organizado el código, qué tono usar, qué no tocar. Sin él, acabas repitiendo la misma información al principio de cada conversación nueva; con él, cualquiera que abra el proyecto (tú en tres meses, o un compañero) parte del mismo punto. Y como se actualiza igual que cualquier otro archivo del proyecto, es el sitio natural donde anotar una decisión de diseño en cuanto Claude la vuelve a acertar mal por segunda vez.\n\n## Ideas clave\n- CLAUDE.md se carga automáticamente al principio de cada sesión de Claude Code en ese proyecto — por eso tiene que ser corto (40–80 líneas ideal, 150 máximo).\n- Se construye por entrevista, con un prompt de arranque concreto: le pides a Claude que te pregunte sección por sección, no que lo escriba de un tirón.\n- Las preguntas cubren cinco bloques: proyecto, preferencias de diseño, arquitectura, tono/contenido y restricciones.\n- Antes de guardar, revísalo con la checklist de longitud y especificidad — y dale a Claude feedback concreto, no genérico.\n- Incluye una plantilla lista para copiar, que Claude rellena con tus respuestas.\n- Se mantiene vivo: vuelve a él cuando Claude repita un error, cambie la estructura del proyecto, o crezca por encima de las 150 líneas (y entonces, divídelo).", "images": ["images/claudemd-el-proceso-paso-a-paso-para-crear-el-tuyo/cover.png"], "glossary": [{"term": "Context rot", "definition": "Cuando un archivo de contexto es tan largo que Claude empieza a \"perder\" o ignorar la información que está en medio, tratándola con menos peso que lo que está al principio o al final."}, {"term": "Plan Mode", "definition": "Un modo de permisos de Claude Code en el que Claude solo puede leer y proponer un plan, no editar archivos todavía — pensado para fases de diseño/entrevista antes de tocar nada."}], "materials": [], "date_added": "2026-08-18", "dictionary": false}];

function bySlug(slug) { return SECTIONS.find(s => s.slug === slug); }

/* ---------- truncado limpio con puntos suspensivos ---------- */
function truncate(str, maxLen) {
  if (!str) return '';
  if (str.length <= maxLen) return str;
  const cut = str.slice(0, maxLen);
  const lastSpace = cut.lastIndexOf(' ');
  const base = lastSpace > maxLen * 0.6 ? cut.slice(0, lastSpace) : cut;
  return base.trim() + '…';
}

/* ---------- post-it arrastrable (masthead) ---------- */
function makeDraggable(el, storageKey) {
  const parent = el.offsetParent || el.parentElement;
  const mobileFlow = () => window.innerWidth <= 760; // en mobile el post-it vive en el flujo normal, bajo el titulo — nada de arrastre
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(storageKey)); } catch(e) {}
  if (saved && !mobileFlow()) { el.style.left = saved.x + 'px'; el.style.top = saved.y + 'px'; }

  let dragging = false, offX = 0, offY = 0;

  el.addEventListener('pointerdown', e => {
    if (mobileFlow()) return;
    if (e.target.closest('a, button')) return;
    dragging = true;
    el.setPointerCapture(e.pointerId);
    const rect = el.getBoundingClientRect();
    offX = e.clientX - rect.left;
    offY = e.clientY - rect.top;
    el.classList.add('dragging');
  });

  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    const pRect = parent.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    let x = e.clientX - pRect.left - offX;
    let y = e.clientY - pRect.top - offY;
    x = Math.max(-elRect.width * 0.3, Math.min(x, pRect.width - elRect.width * 0.7));
    y = Math.max(0, Math.min(y, pRect.height - elRect.height * 0.5));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });

  const stop = e => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    localStorage.setItem(storageKey, JSON.stringify({ x: parseFloat(el.style.left), y: parseFloat(el.style.top) }));
  };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
}

    badge.dataset.filled = '1';
  }
  const items = visibleArticles()
    .slice()
    .sort((x, y) => (y.date_added || '').localeCompare(x.date_added || ''));
  if (!items.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const build = () => items.map(a => {
    const sec = bySlug(a.section);
    return `<a class="item" href="#/articulo/${a.id}"><b>${sec ? sec.name : ''}</b> — ${a.title}</a>`;
  }).join('');
  track.innerHTML = build() + build();
}

/* ---------- soft-delete (papelera) + borrado definitivo (historial) ---------- */
function getHidden() { try { return JSON.parse(localStorage.getItem('hiddenArticles') || '[]'); } catch(e) { return []; } }
function setHidden(arr) { localStorage.setItem('hiddenArticles', JSON.stringify(arr)); }
function getDeleted() { try { return JSON.parse(localStorage.getItem('deletedArticles') || '[]'); } catch(e) { return []; } }
function setDeleted(arr) { localStorage.setItem('deletedArticles', JSON.stringify(arr)); }

function visibleArticles() {
  const hidden = getHidden();
  const deleted = getDeleted();
  return ARTICLES.filter(a => !hidden.includes(a.id) && !deleted.includes(a.id));
}

function reflectionsHtml(a) {
  if (!a.reflections || !a.reflections.length) return '';
  const entries = [...a.reflections].reverse().map(r => `
    <div class="reflection-entry">
      <div class="reflection-date">${r.date || ''}</div>
      <div class="reflection-text">${mdToHtml(r.text || '')}</div>
    </div>
  `).join('');
  return `<div class="art-reflections"><h4>${ICONS['chat-code']} Tu reflexión</h4>${entries}</div>`;
}

/* ---------- artículos relacionados ---------- */
function relatedArticles(a) {
  const pool = visibleArticles().filter(x => x.id !== a.id);
  const myTerms = new Set((a.glossary || []).map(g => g.term.toLowerCase()));
  const scored = pool.map(x => {
    let score = 0;
    if (a.subsection && x.subsection === a.subsection) score += 2;
    else if (x.section === a.section) score += 1;
    const shared = (x.glossary || []).some(g => myTerms.has(g.term.toLowerCase()));
    if (shared) score += 2;
    return { x, score };
  }).filter(s => s.score > 0);
  scored.sort((p, q) => q.score - p.score || (q.x.date_added || '').localeCompare(p.x.date_added || ''));
  return scored.slice(0, 3).map(s => s.x);
}

function relatedHtml(a) {
  const rel = relatedArticles(a);
  if (!rel.length) return '';
  return `<div class="art-related">
    <h4>${ICONS.link} Relacionados</h4>
    <div class="rail">${rel.map(cardHtml).join('')}</div>
  </div>`;
}

/* ---------- liked glossary terms (enciclopedia) ---------- */
function getLikedTerms() { try { return JSON.parse(localStorage.getItem('likedTerms') || '[]'); } catch(e) { return []; } }
function setLikedTerms(arr) { localStorage.setItem('likedTerms', JSON.stringify(arr)); }
function termKey(articleId, idx) { return `${articleId}::${idx}`; }
function toggleLikedTerm(key) {
  const liked = getLikedTerms();
  const i = liked.indexOf(key);
  if (i === -1) liked.push(key); else liked.splice(i, 1);
  setLikedTerms(liked);
  return liked.includes(key);
}

/* ---------- streak (solo para el stat-block "Racha" del panel de progreso) ---------- */
function computeStreak() {
  const dates = new Set(ARTICLES.map(a => a.date_added));
  let streak = 0;
  let cursor = new Date();
  while (true) {
    const iso = cursor.toISOString().slice(0,10);
    if (dates.has(iso)) { streak++; cursor.setDate(cursor.getDate() - 1); }
    else break;
  }
  return streak;
}

function setupLinksScroll() {
  const track = document.getElementById('nav-links');

  const next = document.getElementById('links-next');
  function update() {
    const overflow = track.scrollWidth > track.clientWidth + 2;
    prev.classList.toggle('hidden', !overflow || track.scrollLeft <= 2);
    next.classList.toggle('hidden', !overflow || track.scrollLeft >= track.scrollWidth - track.clientWidth - 2);
  }
  prev.addEventListener('click', () => { track.scrollBy({ left: -160, behavior: 'smooth' }); });
  next.addEventListener('click', () => { track.scrollBy({ left: 160, behavior: 'smooth' }); });
  track.addEventListener('scroll', update);
  window.addEventListener('resize', update);
  update();
}

/* ---------- markdown -> html (small subset) ---------- */
/* ---------- anotaciones: ampliaciones y ejemplos sobre una cita exacta ---------- */
const ANNOT_META = {
  ampliacion: { icon: 'plus', label: 'Ampliación' },
  ejemplo: { icon: 'eye', label: 'Ejemplo' },
};

/* varias anotaciones pueden compartir la misma cita a propósito (p. ej. una ampliación y
   su ejemplo sobre la misma frase) — se agrupan para pintar un único resaltado con los
   dos rayados a la vez, en vez de intentar envolver el mismo texto dos veces */
function groupAnnotationsByQuote(annotations) {
  const groups = new Map();
  (annotations || []).forEach((an, idx) => {
    if (!an.quote) return;
    if (!groups.has(an.quote)) groups.set(an.quote, []);
    groups.get(an.quote).push(idx);
  });
  return groups;
}

/* envuelve, dentro de una línea de texto ya en plano, cada cita sin usar que aparezca en
   ella — las citas más largas van primero para que una corta no rompa a una que la
   contiene; cada cita se resalta como mucho una vez en todo el artículo */
function applyAnnotations(text, annotations, usedQuotes) {
  let result = text;
  const groups = groupAnnotationsByQuote(annotations);
  const quotes = [...groups.keys()].sort((a, b) => b.length - a.length);
  quotes.forEach(quote => {
    if (usedQuotes.has(quote) || !result.includes(quote)) return;
    const idxs = groups.get(quote);
    const types = [...new Set(idxs.map(i => annotations[i].type === 'ejemplo' ? 'ejemplo' : 'ampliacion'))];
    const classes = types.map(t => `annot-${t}`).join(' ');
    const icons = types.map(t => ICONS[(ANNOT_META[t] || ANNOT_META.ampliacion).icon]).join('');
    result = result.replace(quote,
      `<mark class="annot ${classes}" data-annot-idxs="${idxs.join(',')}" tabindex="0">${quote}<span class="annot-icon">${icons}</span></mark>`);
    usedQuotes.add(quote);
  });
  return result;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function mdToHtml(md, annotations) {
  if (!md) return '';
  const lines = md.replace(/\r/g,'').split('\n');
  const used = new Set();
  let html = '';
  let inList = false;
  const inlineFmt = (s) => applyAnnotations(s, annotations, used)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let i = 0;
  while (i < lines.length) {
    const l = lines[i].trim();
    // bloque ```...``` -> se copia tal cual, no se interpreta como markdown (así una
    // plantilla que lleva sus propios ## o - por dentro no se rompe al renderizarla)
    if (l.startsWith('```')) {
      const codeLines = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith('```')) { codeLines.push(lines[i]); i++; }
      i++;
      if (inList) { html += '</ul>'; inList = false; }
      const raw = codeLines.join('\n');
      html += `<pre class="code-block" data-copy="${raw.replace(/"/g, '&quot;')}" title="Copiar">${escapeHtml(raw)}</pre>`;
      continue;
    }
    const imgMatch = l.match(/^!\[(.*?)\]\((.+?)\)$/);
    if (imgMatch) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<figure class="art-figure"><img src="${imgMatch[2]}" alt="${imgMatch[1]}" loading="lazy">${imgMatch[1] ? `<figcaption>${imgMatch[1]}</figcaption>` : ''}</figure>`;
    } else if (l.startsWith('## ')) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h2>${inlineFmt(l.slice(3))}</h2>`;
    } else if (l.startsWith('# ')) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h2>${inlineFmt(l.slice(2))}</h2>`;
    } else if (l.startsWith('- ') || l.startsWith('* ')) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inlineFmt(l.slice(2))}</li>`;
    } else if (l === '---') {
      if (inList) { html += '</ul>'; inList = false; }
    } else if (l === '') {
      if (inList) { html += '</ul>'; inList = false; }
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<p>${inlineFmt(l)}</p>`;
    }
    i++;
  }
  if (inList) html += '</ul>';
  return html;
}
