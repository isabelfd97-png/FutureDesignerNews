<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Future Designer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  :root {
    --bg: #ffffff;
    --ink: #0a0a0a;
    --muted: #7a7a7a;
    --accent: #ff5a1f;
    --line: #0a0a0a;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Space Grotesk', Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(rgba(10,10,10,0.16) 1px, transparent 1.4px);
    background-size: 22px 22px;
    color: var(--ink);
  }
  a { color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
  main.wrap { padding-top: 34px; }
  .mono { font-family: 'Space Mono', monospace; }

  /* ---- Masthead ---- */
  header.masthead { padding: 30px 24px 0; border-bottom: 4px solid var(--ink); position: relative; }
  .top-bar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }

  .live {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin: 4px 0 2px;
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted);
  }
  .live .dot-wrap { position: relative; width: 9px; height: 9px; }
  .live .dot-wrap::before, .live .dot-wrap::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent);
  }
  .live .dot-wrap::after {
    animation: radar 1.6s ease-out infinite;
  }
  @keyframes radar { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3.2); opacity: 0; } }

  h1.title {
    font-family: 'Archivo Black', 'Space Grotesk', sans-serif;
    font-weight: 400; font-size: 62px; letter-spacing: -2px;
    margin: 14px 0 30px; text-align: center; text-transform: uppercase; line-height: .92;
  }
  h1.title span { display: inline-block; opacity: 0; transform: translateY(18px) rotate(-1deg); animation: riseIn .55s cubic-bezier(.2,.8,.2,1) forwards; }
  h1.title span:nth-child(odd) { color: var(--accent); }
  @keyframes riseIn { to { opacity: 1; transform: translateY(0) rotate(0); } }

  /* ---- Masthead utils: buscar, historial ---- */
  .masthead-utils {
    display: flex; align-items: center; gap: 8px; flex: none;
  }
  .masthead-search-btn {
    height: 38px; flex: none; display: flex; align-items: center; gap: 6px;
    padding: 0 14px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700;
  }
  .masthead-search-btn svg { width: 15px; height: 15px; flex: none; }
  .masthead-search-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  .masthead-utils .hist-link {
    display: flex; align-items: center; gap: 6px; height: 38px; flex: none;
    padding: 0 14px; border: 2px solid var(--ink); font-family: 'Space Mono', monospace;
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase; text-decoration: none;
    color: var(--ink); font-weight: 700;
  }
  .masthead-utils .hist-link svg { width: 15px; height: 15px; }
  .masthead-utils .hist-link:hover, .masthead-utils .hist-link.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---- Nota "Ofrecido por Isabel": el mismo post-it que las anotaciones, pero arrastrable ---- */
  .subtitle {
    position: absolute; top: 20px; left: 24px; width: 280px; z-index: 6;
    display: flex; flex-direction: column; gap: 7px;
    background: #ffddc2; border: 2px solid var(--ink); box-shadow: 5px 6px 0 var(--ink);
    padding: 13px 16px 15px; transform: rotate(-4deg);
    cursor: grab; touch-action: none; user-select: none;
  }
  .subtitle.dragging { cursor: grabbing; box-shadow: 8px 10px 0 var(--ink); z-index: 50; transition: none; }
  .subtitle-row { display: flex; align-items: center; gap: 9px; }
  .subtitle-avatar {
    width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--ink); flex: none;
    object-fit: cover; object-position: center 15%; background: #fff; pointer-events: none;
  }
  .subtitle-text { display: flex; flex-direction: column; gap: 2px; }
  .subtitle-name {
    font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 14px; letter-spacing: -.2px;
    text-transform: uppercase; color: var(--ink);
  }
  .subtitle-byline {
    font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: .3px;
    text-transform: uppercase; color: var(--accent); text-decoration: underline; cursor: pointer;
  }
  .subtitle-phrase { font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.45; color: var(--ink); font-weight: 400; }

  /* ---- Ticker ---- */
  .ticker {
    margin: 0 -24px;
    border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent);
    background: rgba(255, 90, 31, 0.06);
    white-space: nowrap; position: relative; cursor: pointer;
  }
  .ticker:hover { background: rgba(255, 90, 31, 0.12); }
  .ticker-scroll { overflow: hidden; }
  .ticker-track { display: inline-block; padding: 8px 0; animation: scrollTicker 64s linear infinite; }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ticker .item { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .5px; padding: 0 22px; color: var(--muted); text-decoration: none; }
  .ticker a.item:hover { color: var(--accent); }
  .ticker a.item:hover b { color: var(--accent); }
  .ticker .item b { color: var(--ink); font-weight: 700; }
  .ticker.empty-state .ticker-track { animation: none; padding: 8px 22px; }
  @keyframes scrollTicker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .ticker-badge {
    position: absolute; top: -30px; left: 18px; width: 76px; height: 76px;
    z-index: 3; pointer-events: none; display: flex; align-items: center; justify-content: center;
    animation: burstWiggle 2.6s ease-in-out infinite;
  }
  .ticker-badge svg.burst { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ticker-badge span {
    position: relative; transform: rotate(5deg);
    font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: .5px; text-transform: uppercase; color: #fff; text-align: center; line-height: 1.15;
  }
  @keyframes burstWiggle {
    0%, 100% { transform: rotate(-9deg); }
    50% { transform: rotate(-3deg); }
  }
  .ticker.empty-state .ticker-badge { display: none; }

  /* ---- Modal de artículos sin valorar (teleprompter) ---- */
  .ticker-modal {
    position: fixed; inset: 0; background: rgba(10,10,10,0.55); z-index: 55;
    display: none; align-items: flex-start; justify-content: center; padding-top: 10vh;
  }
  .ticker-modal.open { display: flex; }
  .ticker-modal-panel {
    width: 100%; max-width: 640px; margin: 0 24px; background: var(--bg);
    border: 2px solid var(--ink); box-shadow: 10px 10px 0 rgba(0,0,0,0.25);
    max-height: 72vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .ticker-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 2px solid var(--ink); }
  .ticker-modal-header h3 { margin: 0; font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 17px; text-transform: uppercase; letter-spacing: -.5px; }
  .close-btn-sm { border: 2px solid var(--ink); background: var(--bg); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .close-btn-sm:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .close-btn-sm svg { width: 14px; height: 14px; }
  .ticker-modal-list { overflow-y: auto; padding: 4px 0; }
  .tm-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 20px; border-bottom: 1px solid #eee; transition: opacity .25s ease, transform .25s ease; }
  .tm-row.tm-row-out { opacity: 0; transform: translateX(14px); }
  .tm-title { flex: 1; min-width: 0; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .tm-title:hover h4 { color: var(--accent); }
  .tm-title h4 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14.5px; line-height: 1.3; }
  .tm-stars { display: flex; gap: 2px; flex: none; }
  .tm-stars .star-btn { border: none; background: transparent; padding: 2px; cursor: pointer; color: var(--ink); }
  .tm-stars .star-btn svg { width: 16px; height: 16px; display: block; }
  .tm-stars .star-btn:hover, .tm-stars .star-btn.on { color: var(--accent); }

  /* ---- Nav ---- */
  nav.sections {
    margin: 0 -24px;
    padding: 0 24px;
    display: flex; justify-content: center; align-items: stretch;
  }
  .links-wrap { min-width: 0; display: flex; align-items: stretch; position: relative; }
  nav.sections .links {
    display: flex; flex-wrap: nowrap; overflow-x: auto; scroll-behavior: smooth;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  nav.sections .links::-webkit-scrollbar { display: none; }
  .links-arrow {
    flex: none; width: 32px; display: flex; align-items: center; justify-content: center;
    background: var(--bg); border: none; cursor: pointer; color: var(--ink);
  }
  .links-arrow.left svg { transform: scaleX(-1); }
  .links-arrow svg { width: 13px; height: 13px; }
  .links-arrow:hover { color: var(--accent); }
  .links-arrow.hidden { display: none; }
  nav.sections a {
    position: relative; text-decoration: none; color: var(--ink); flex: none;
    padding: 13px 18px; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase;
    font-weight: 700; white-space: nowrap; font-family: 'Space Mono', monospace;
  }
  nav.sections a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .18s ease;
  }
  nav.sections a:hover::after, nav.sections a.active::after { transform: scaleX(1); }
  nav.sections a:hover, nav.sections a.active { color: var(--accent); }

  /* ---- Glossary (article view) ---- */
  .art-glossary { margin-top: 40px; padding-top: 18px; border-top: 3px solid var(--ink); }
  .art-glossary h4 { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
  .glossary-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #e5e5e5; }
  .glossary-item:last-child { border-bottom: none; }
  .glossary-item .gterm { flex: 1; }
  .glossary-item .gterm b { font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; display: block; margin-bottom: 3px; }
  .glossary-item .gterm span { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .like-btn { border: 2px solid var(--ink); background: var(--bg); width: 34px; height: 34px; flex: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .like-btn svg { width: 16px; height: 16px; }
  .like-btn:hover { border-color: var(--accent); color: var(--accent); }
  .like-btn.liked { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* ---- Reflexiones (de la skill Article Debate) ---- */
  .art-reflections { margin-top: 32px; border: 2px solid var(--ink); }
  .art-reflections h4 { display: flex; align-items: center; gap: 8px; margin: 0; padding: 12px 18px; background: var(--ink); color: #fff; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
  .art-reflections h4 svg { width: 16px; height: 16px; }
  .reflection-entry { padding: 16px 18px; }
  .reflection-entry + .reflection-entry { border-top: 1px dashed #ccc; }
  .reflection-date { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .5px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .reflection-text { margin: 6px 0 0; font-size: 15px; line-height: 1.65; }
  .reflection-text p { margin: 0 0 10px; }
  .reflection-text p:last-child { margin-bottom: 0; }

  /* ---- Artículos relacionados ---- */
  .art-related { margin-top: 40px; padding-top: 18px; border-top: 3px solid var(--ink); }
  .art-related h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }
  .art-related h4 svg { width: 14px; height: 14px; }
  .art-related .rail { padding-bottom: 4px; }

  .dict-badge {
    flex: none; display: flex; align-items: center; gap: 5px; font-family: 'Space Mono', monospace;
    font-size: 9.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--accent);
  }
  .dict-badge svg { width: 14px; height: 14px; }

  /* ---- Enciclopedia ---- */
  .ency-toolbar { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
  .ency-toolbar .ency-search-row { flex: 1; margin: 0; }
  .review-btn {
    display: flex; align-items: center; gap: 8px; flex: none; background: var(--ink); color: #fff; border: 2px solid var(--ink);
    font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    padding: 10px 16px; cursor: pointer;
  }
  .review-btn svg { width: 15px; height: 15px; }
  .review-btn:hover { background: var(--accent); border-color: var(--accent); }

  /* ---- CTA de repasar, a la altura del titular de Enciclopedia ---- */
  .section-hero.ency-hero { justify-content: space-between; flex-wrap: wrap; row-gap: 14px; }
  .review-cta {
    display: flex; align-items: center; gap: 9px; flex: none; background: var(--accent); color: #fff; border: 2px solid var(--ink);
    font-family: 'Space Mono', monospace; font-size: 12.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    padding: 14px 20px; cursor: pointer; box-shadow: 4px 5px 0 var(--ink);
  }
  .review-cta svg { width: 17px; height: 17px; }
  .review-cta:hover { background: var(--ink); transform: translate(-2px,-2px); box-shadow: 6px 7px 0 var(--accent); }

  .ency-search-row { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--ink); padding: 10px 0; margin: 18px 0 6px; }
  .ency-search-row svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .ency-search-row input { flex: 1; border: none; outline: none; background: transparent; font-family: 'Space Grotesk', sans-serif; font-size: 15px; color: var(--ink); }

  .ency-layout { display: flex; gap: 28px; align-items: flex-start; margin-top: 10px; }
  .ency-list { flex: 1; min-width: 0; }
  .ency-letter-group { margin-bottom: 8px; }
  .ency-letter-heading {
    font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 26px; color: var(--accent);
    padding: 18px 0 6px; border-bottom: 3px solid var(--ink); scroll-margin-top: 90px;
  }
  .ency-vlist { display: flex; flex-direction: column; }
  .ency-row { padding: 16px 0; border-bottom: 1px solid #e5e5e5; display: flex; flex-direction: column; gap: 6px; }
  .ency-row b { font-family: 'Space Grotesk', sans-serif; font-size: 16px; }
  .ency-row p { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
  .ency-row .src { font-family: 'Space Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); cursor: pointer; text-decoration: none; width: fit-content; }
  .ency-row .src:hover { text-decoration: underline; }

  .ency-index {
    position: sticky; top: 110px; flex: none; display: flex; flex-direction: column; gap: 1px;
    font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; max-height: 70vh; overflow-y: auto;
  }
  .ency-index::-webkit-scrollbar { display: none; }
  .ency-index a { color: var(--muted); text-decoration: none; padding: 2px 4px; text-align: center; }
  .ency-index a:hover { color: var(--ink); }
  .ency-index a.active { color: var(--accent); }

  /* ---- Flashcards de repaso ---- */
  .flash-panel { max-width: 460px; }
  .flash-modal-body { padding: 26px 22px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .flash-progress { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted); align-self: flex-start; }
  .flash-card {
    width: 100%; min-height: 200px; border: 2px solid var(--ink); background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 30px 22px; cursor: pointer; gap: 14px;
  }
  .flash-card.revealed { cursor: default; border-color: var(--accent); }
  .flash-term { font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 24px; text-transform: uppercase; letter-spacing: -.5px; line-height: 1.15; }
  .flash-tap { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; }
  .flash-def { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink); }
  .flash-card .src { font-family: 'Space Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); text-decoration: none; }
  .flash-card .src:hover { text-decoration: underline; }
  .flash-actions { display: flex; gap: 12px; width: 100%; }
  .flash-actions button {
    flex: 1; border: 2px solid var(--ink); background: var(--bg); padding: 12px; cursor: pointer;
    font-family: 'Space Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .flash-actions button svg { width: 14px; height: 14px; }
  .flash-no:hover { background: #eee; }
  .flash-actions .flash-yes { background: var(--ink); color: #fff; }
  .flash-yes:hover { background: var(--accent); border-color: var(--accent); }
  .flash-done { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 10px 0 6px; }
  .flash-done svg { width: 34px; height: 34px; color: var(--accent); }
  .flash-done p { margin: 0; font-size: 15px; }

  @media (max-width: 760px) {
    .ency-index { position: fixed; right: 6px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.92); padding: 4px 2px; z-index: 10; }
  }

  /* ---- Controls ---- */
  .controls { display: flex; gap: 0; border-bottom: 1px solid #ccc; margin-top: 14px; }
  input[type=text] {
    flex: 1; min-width: 160px; padding: 10px 4px; border: none; font-size: 14px;
    font-family: 'Space Grotesk', sans-serif; background: transparent; color: var(--ink);
  }
  input[type=text]:focus { outline: none; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 0; }
  .chip {
    font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700;
    border: 2px solid var(--ink); padding: 5px 11px; cursor: pointer; background: var(--bg); color: var(--ink);
  }
  .chip.active, .chip:hover { background: var(--ink); color: #fff; }

  main { padding-bottom: 70px; }
  .count { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 14px 0; }

  /* ---- Section hero ---- */
  .section-hero { display: flex; align-items: center; gap: 16px; padding: 6px 0 10px; }
  .section-hero .icon { width: 44px; height: 44px; flex: none; }
  .section-hero .icon svg { width: 100%; height: 100%; }
  .section-hero h2 { font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 32px; margin: 0; text-transform: uppercase; letter-spacing: -1px; }
  .section-hero p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }

  /* ---- Panel de progreso (Historial) ---- */
  .progress-panel { margin: 24px 0 8px; border: 2px solid var(--ink); }
  .stat-row { display: flex; }
  .stat-block { flex: 1; padding: 18px 16px; text-align: center; border-right: 2px solid var(--ink); }
  .stat-block:last-child { border-right: none; }
  .stat-num { font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 30px; color: var(--accent); line-height: 1; }
  .stat-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .stat-bars { border-top: 2px solid var(--ink); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .stat-bar-row { display: flex; align-items: center; gap: 10px; }
  .stat-bar-label { flex: 0 0 150px; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--ink); }
  .stat-bar-track { flex: 1; height: 8px; background: #eee; }
  .stat-bar-fill { height: 100%; background: var(--accent); }
  .stat-bar-count { flex: none; font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); width: 20px; text-align: right; }

  .subsection-title {
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #fff;
    background: var(--accent); display: inline-block; padding: 4px 10px; font-weight: 700; margin: 28px 0 0;
    scroll-margin-top: 90px;
  }

  /* ---- Secondary nav (subsections) ---- */
  .subnav { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 0 0; }
  .subnav-pill {
    font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase;
    font-weight: 700; border: 2px solid var(--ink); padding: 5px 11px; text-decoration: none; color: var(--ink);
    background: var(--bg); cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .subnav-pill:hover { color: var(--accent); border-color: var(--accent); }
  .subnav-pill.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ---- Rail (horizontal scroll) ---- */
  .rail { display: flex; gap: 16px; overflow-x: auto; padding: 6px 4px 18px; margin-top: 4px; scroll-behavior: smooth; }
  .rail .card { flex: 0 0 300px; }
  .rail::-webkit-scrollbar { height: 6px; }
  .rail::-webkit-scrollbar-track { background: transparent; }
  .rail::-webkit-scrollbar-thumb { background: var(--ink); }

  /* ---- Front page: tabloide, cronología pura ---- */
  .front-label {
    font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: #fff;
    background: var(--ink); display: inline-block; padding: 4px 10px; font-weight: 700; margin: 26px 0 12px; width: fit-content;
  }
  .front-divider { display: flex; align-items: center; gap: 12px; margin: 34px 0 4px; }
  .front-divider::before, .front-divider::after { content: ''; flex: 1; height: 3px; background: var(--ink); }
  .front-divider::before { max-width: 28px; }
  .front-divider .front-label { margin: 0; flex: none; }

  /* ---- Fila superior: titular manda, últimas entradas es columna pequeña ---- */
  .front-top { display: grid; grid-template-columns: 2.3fr 1fr; gap: 26px; align-items: start; margin-top: 4px; }
  .front-top.no-lead { display: block; }
  .front-lead .fp-hero .fp-img { height: 320px; }
  .front-lead .fp-hero .fp-body { padding: 20px 22px; gap: 8px; }
  .front-lead .fp-hero h2 { font-size: 36px; }
  .front-lead .fp-hero p { font-size: 15px; }
  .front-briefs-col .front-label { margin-top: 0; }

  /* ---- Controles del carrusel de 5★ (debajo del titular) ---- */
  .lead-controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 14px; }
  .lead-arrow {
    border: 2px solid var(--ink); background: var(--bg); width: 30px; height: 30px; flex: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
  }
  .lead-arrow svg { width: 13px; height: 13px; }
  .lead-arrow.left svg { transform: scaleX(-1); }
  .lead-arrow:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lead-dots { display: flex; gap: 8px; }
  .lead-dot {
    width: 9px; height: 9px; border-radius: 50%; background: #ddd; border: 2px solid var(--ink);
    padding: 0; cursor: pointer;
  }
  .lead-dot.on { background: var(--accent); border-color: var(--accent); }

  /* ---- Titular sin imagen: icono de sección, sin bloque gris ---- */
  .lead-icon { width: 52px; height: 52px; color: var(--ink); margin-bottom: 4px; image-rendering: pixelated; }
  .lead-icon svg { width: 100%; height: 100%; shape-rendering: crispEdges; }

  /* ---- Apuntes (los 2 siguientes más recientes), en fila debajo ---- */
  .front-picks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 14px; }
  .picks-subsection:first-of-type .subsection-title { margin-top: 20px; }
  .front-pick {
    display: flex; gap: 0; text-decoration: none; color: var(--ink); height: 96px;
    border: 2px solid var(--ink); position: relative; transition: border-color .15s ease;
  }
  .front-pick:hover { border-color: var(--accent); }
  .front-pick:hover h3 { color: var(--accent); }
  .front-pick .fp-img, .front-pick .fp-noimg { width: 96px; flex: none; border-right: 2px solid var(--ink); object-fit: cover; height: 100%; }
  .front-pick .fp-noimg { display: flex; align-items: center; justify-content: center; background: #f2f2f2; }
  .front-pick .fp-noimg svg { width: 26px; height: 26px; color: var(--ink); opacity: .5; }
  .front-pick .pick-body { padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 5px; min-width: 0; }
  .front-pick .pick-tag { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: .6px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .front-pick h3 {
    margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14.5px; line-height: 1.28;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: color .15s ease;
  }

  /* ---- Empty state de "Últimas entradas" ---- */
  .briefs-empty {
    border: 2px dashed var(--ink); padding: 26px 18px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 180px; justify-content: center;
  }
  .briefs-empty-icon { width: 26px; height: 26px; color: var(--accent); opacity: .55; }
  .briefs-empty-icon svg { width: 100%; height: 100%; }
  .briefs-empty p { margin: 0; font-size: 13px; line-height: 1.5; font-weight: 700; color: var(--ink); }
  .briefs-empty .briefs-empty-sub { font-weight: 400; color: var(--muted); font-size: 12px; }

  /* ---- Breves: columna angosta, título en varias líneas ---- */
  .front-briefs { border-top: 3px solid var(--ink); }
  .brief-row {
    display: flex; flex-direction: column; align-items: flex-start; gap: 7px; padding: 13px 2px; border-bottom: 1px solid #ddd;
    text-decoration: none; color: var(--ink);
  }
  .brief-row:hover { background: rgba(255,90,31,0.06); }
  .brief-row:hover .brief-title { color: var(--accent); }
  .brief-stamp {
    flex: none; font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    border: 2px solid var(--ink); padding: 4px 8px; background: var(--bg); transform: rotate(-3deg);
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }
  .brief-row:nth-child(3n+2) .brief-stamp { transform: rotate(2deg); }
  .brief-row:nth-child(3n) .brief-stamp { transform: rotate(-1.5deg); }
  .brief-row:hover .brief-stamp {
    background: var(--accent); border-color: var(--accent); color: #fff;
    animation: stampWiggle .45s ease;
  }
  @keyframes stampWiggle {
    0% { transform: rotate(-3deg) scale(1); }
    35% { transform: rotate(-9deg) scale(1.1); }
    65% { transform: rotate(6deg) scale(1.1); }
    100% { transform: rotate(-2deg) scale(1.05); }
  }
  .brief-title {
    width: 100%; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; line-height: 1.32;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; transition: color .15s ease;
  }
  .brief-meta { display: flex; align-items: center; gap: 10px; }
  .brief-date { font-size: 10.5px; color: var(--muted); }

  /* ---- Paginación de "Últimas entradas" ---- */
  .brief-pagination { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; }
  .brief-pg-arrow {
    border: 2px solid var(--ink); background: var(--bg); width: 26px; height: 26px; flex: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
  }
  .brief-pg-arrow svg { width: 11px; height: 11px; }
  .brief-pg-arrow.left svg { transform: scaleX(-1); }
  .brief-pg-arrow:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .brief-pg-arrow:disabled { opacity: .3; cursor: default; }
  .brief-pg-nums { display: flex; gap: 6px; }
  .brief-pg-num {
    border: 2px solid var(--ink); background: var(--bg); width: 26px; height: 26px; flex: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
    font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
  }
  .brief-pg-num:hover { border-color: var(--accent); color: var(--accent); }
  .brief-pg-num.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ---- Mini rating badge (miniaturas) ---- */
  .mini-rating { display: flex; align-items: center; gap: 3px; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; }
  .mini-rating svg { width: 11px; height: 11px; }
  .mini-rating.overlay { position: absolute; top: 8px; right: 8px; background: rgba(10,10,10,.75); color: #fff; padding: 3px 7px; z-index: 2; }
  .mini-rating.overlay svg { color: var(--accent); }
  .mini-rating.overlay.muted svg { color: rgba(255,255,255,.4); }
  .mini-rating.overlay.muted span { color: rgba(255,255,255,.65); }
  .mini-rating.inline { color: var(--accent); }
  .mini-rating.inline svg { color: var(--accent); }
  .mini-rating.inline.muted, .mini-rating.inline.muted svg { color: var(--muted); }

  @media (max-width: 760px) {
    .front-top { grid-template-columns: 1fr; }
    .front-lead .fp-hero .fp-img { height: 180px; }
    .front-lead .fp-hero h2 { font-size: 23px; }
    .front-picks { grid-template-columns: 1fr; }
    .front-pick { height: 76px; }
    .front-pick .fp-img, .front-pick .fp-noimg { width: 64px; }
    .brief-title { font-size: 14px; }
    .brief-meta { gap: 8px; }
    .brief-date { display: none; }
  }

  .fp-card {
    position: relative; display: block; text-decoration: none; color: var(--ink); border: 2px solid var(--ink);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, color .15s ease;
  }
  .fp-card:hover { color: var(--accent); border-color: var(--accent); transform: translate(-4px,-4px); box-shadow: 6px 6px 0 var(--ink); }
  .fp-card .fp-img { width: 100%; display: block; object-fit: cover; filter: grayscale(100%) contrast(1.08); border-bottom: 2px solid var(--ink); }
  .fp-card:hover .fp-img { border-color: var(--accent); }
  .fp-card .fp-body { padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .fp-noimg { display: flex; align-items: center; justify-content: center; background: #f2f2f2; border-bottom: 2px solid var(--ink); }
  .fp-card:hover .fp-noimg { border-color: var(--accent); }
  .fp-noimg svg { width: 30%; max-width: 64px; height: auto; color: var(--ink); opacity: .5; }
  .fp-hero .fp-noimg { height: 320px; }

  .fp-hero .fp-img { height: 320px; }
  .fp-hero h2 { margin: 0; font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 36px; line-height: 1.02; letter-spacing: -1px; text-transform: uppercase; }
  .fp-hero p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ink); }
  .fp-hero.no-media .fp-body { padding: 40px 32px; gap: 14px; }
  .fp-hero.no-media h2 { font-size: 44px; }
  .fp-hero.no-media p { font-size: 16.5px; }

  /* ---- Portada: titular + segundo nivel ---- */
  .front-lead-single { margin-top: 6px; }
  .front-secondary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 18px; }
  .fp-secondary .fp-img, .fp-secondary .fp-noimg { height: 190px; }
  .fp-secondary h3 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.18; }
  .fp-secondary p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .fp-secondary .date { font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  @media (max-width: 720px) { .front-secondary { grid-template-columns: 1fr; } }

  /* ---- Leído / no leído ---- */

  /* ---- Grid / cards ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 14px; }
  .card {
    position: relative; background: var(--bg); border: 2px solid var(--ink);
    padding: 20px; display: flex; flex-direction: column; gap: 10px; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, color .15s ease;
    text-decoration: none;
  }
  .card:hover { color: var(--accent); border-color: var(--accent); transform: translate(-5px,-5px); box-shadow: 6px 6px 0 var(--ink); }
  .card-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .tag { display: inline-block; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.2px; color: var(--accent); border: 1px solid var(--accent); padding: 3px 9px; width: fit-content; font-weight: 700; text-transform: uppercase; }
  .card p {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ---- Insignia de "con anotaciones": avatar de Isabel + bocadillo ---- */
  /* solo el subrayado: nada de caja, ni avatar — el mismo rotulador que las anotaciones
     dentro del artículo, directamente sobre la miniatura */
  .annot-flag { position: absolute; top: 10px; right: 10px; z-index: 4; }
  .annot-flag-text {
    font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700;
    letter-spacing: .2px; color: #fff; white-space: nowrap; padding: 8px 12px;
    background-image: linear-gradient(103deg, transparent 0%, transparent 2%, var(--accent) 4%, var(--accent) 95%, transparent 97%, transparent 100%);
  }
  @media (max-width: 480px) { .annot-flag-text { font-size: 12px; } }
  .card .annot-flag { top: 6px; right: 6px; }
  .card .annot-flag-text { font-size: 11px; padding: 5px 8px; }
  .card h3 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; transition: transform .2s ease; }
  .card:hover h3 { transform: skewX(-1deg); }
  .card p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .card .date { font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--muted); margin-top: auto; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-style: italic; }

  /* ---- Historial ---- */
  table.hist { width: 100%; border-collapse: collapse; margin-top: 16px; }
  table.hist th { text-align: left; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; border-bottom: 3px solid var(--ink); padding: 8px 6px; }
  table.hist td { padding: 10px 6px; border-bottom: 1px solid #ddd; font-size: 13.5px; vertical-align: top; }
  table.hist tr.hidden-row td { text-decoration: line-through; color: #bbb; }
  .row-actions { display: flex; gap: 6px; }
  .del-btn { border: 2px solid var(--ink); background: var(--bg); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .del-btn svg { width: 14px; height: 14px; }
  .del-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .del-btn.restore-btn:hover { background: var(--ink); border-color: var(--ink); }
  .del-btn.perm-btn:hover { background: var(--accent); border-color: var(--accent); }
  .hist-title { cursor: pointer; font-weight: 700; }
  .hist-title:hover { color: var(--accent); }
  .hist-status { font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; font-size: 12px; font-family: 'Space Mono', monospace; max-width: 480px; z-index: 50; display: none; }
  .toast button { margin-left: 10px; background: var(--accent); border: none; color: #fff; padding: 4px 8px; font-size: 10.5px; cursor: pointer; text-transform: uppercase; letter-spacing: .5px; }

  /* ---- Article overlay ---- */
  .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 40; overflow-y: auto; display: none; }
  .overlay.open { display: block; }
  .overlay-inner { max-width: 720px; margin: 0 auto; padding: 60px 24px 100px; position: relative; }
  .overlay .close-btn { position: fixed; top: 20px; right: 24px; width: 36px; height: 36px; border: 2px solid var(--ink); background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 41; }
  .overlay .close-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .overlay .close-btn svg { width: 16px; height: 16px; }
  .art-cover-wrap { position: relative; width: 100%; height: min(38vh, 320px); overflow: hidden; }
  .art-cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(100%) contrast(1.05); }
  .art-cover-wrap::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,255,255,0) 55%, var(--bg) 96%);
  }
  @media (max-width: 640px) { .art-cover-wrap { height: min(30vh, 220px); } }
  .overlay-inner.has-cover { padding-top: 22px; }
  .art-icon { width: 46px; height: 46px; color: var(--ink); margin-bottom: 10px; }
  .art-icon svg { width: 100%; height: 100%; shape-rendering: crispEdges; }
  .art-tag { font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .art-title { font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 42px; line-height: 1.05; margin: 10px 0 6px; letter-spacing: -1px; opacity: 0; transform: translateY(10px); animation: riseIn .5s ease forwards .1s; }
  .art-meta {
    font-family: 'Space Mono', monospace; font-size: 11.5px; color: var(--muted);
    border-bottom: 1px solid #ddd; padding-bottom: 18px; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .art-body h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px; margin: 26px 0 8px; }
  .art-body p { font-size: 16px; line-height: 1.7; margin: 0 0 14px; }
  .art-body ul { font-size: 15.5px; line-height: 1.7; padding-left: 22px; }
  .art-body strong { background: linear-gradient(transparent 60%, rgba(255,90,31,.3) 60%); }

  /* ---- Anotaciones: ampliaciones (amarillo) y ejemplos (azul) sobre una cita del texto ----
     El resaltado imita un rotulador fosforito pasado a mano; si una misma frase tiene los
     dos tipos a la vez, se ven los dos rayados uno encima del otro, en vez de mezclarse. ---- */
  mark.annot {
    background: none; color: inherit; cursor: pointer; padding: 0.03em 0.15em;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  mark.annot .annot-icon { display: inline-flex; gap: 2px; margin-left: 2px; vertical-align: -1px; }
  mark.annot .annot-icon svg { width: 12px; height: 12px; opacity: .7; }
  mark.annot:hover .annot-icon svg, mark.annot.open .annot-icon svg { opacity: 1; }
  mark.annot-ampliacion { background-image: linear-gradient(103deg, transparent 0%, transparent 2%, rgba(255,209,10,.6) 4%, rgba(255,209,10,.6) 95%, transparent 97%, transparent 100%); }
  mark.annot-ejemplo { background-image: linear-gradient(103deg, transparent 0%, transparent 2%, rgba(96,170,255,.5) 4%, rgba(96,170,255,.5) 95%, transparent 97%, transparent 100%); }
  mark.annot-ampliacion.annot-ejemplo {
    background-image:
      linear-gradient(103deg, transparent 0%, transparent 2%, rgba(255,209,10,.6) 4%, rgba(255,209,10,.6) 95%, transparent 97%, transparent 100%),
      linear-gradient(103deg, transparent 0%, transparent 2%, rgba(96,170,255,.5) 4%, rgba(96,170,255,.5) 95%, transparent 97%, transparent 100%);
    background-position: 0 100%, 0 0%;
    background-size: 100% 48%, 100% 52%;
    background-repeat: no-repeat, no-repeat;
  }

  /* nota tipo post-it, fija justo debajo de la frase subrayada (se mueve con el texto
     al hacer scroll porque vive dentro de .overlay-inner, no pegada al viewport) */
  .annot-note {
    position: absolute; width: 340px; z-index: 5; cursor: pointer;
    border: 2px solid var(--ink); box-shadow: 3px 4px 0 rgba(10,10,10,.3);
    padding: 13px 16px 14px; font-size: 13px; line-height: 1.48;
    transform: rotate(-1.1deg);
  }
  .annot-note.stack-2 { transform: rotate(1.6deg); }
  .annot-note-ampliacion { background: #fff1a6; }
  .annot-note-ejemplo { background: #bfe0ff; }
  .annot-note-close {
    position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border: none;
    background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;
    opacity: .6;
  }
  .annot-note-close:hover { opacity: 1; }
  .annot-note-close svg { width: 11px; height: 11px; }
  .annot-note-label { display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; margin-bottom: 7px; padding-right: 22px; color: var(--ink); }
  .annot-note-label svg { width: 13px; height: 13px; flex: none; }
  .annot-note-text { color: var(--ink); display: block; }
  .annot-note-text a { color: var(--ink); text-decoration: underline; }
  @media (max-width: 640px) { .annot-note { width: min(84vw, 340px); } }
  .art-figure { margin: 22px 0; }
  .art-figure img { width: 100%; height: auto; display: block; border: 2px solid var(--ink); filter: grayscale(100%) contrast(1.05); }
  .art-figure figcaption { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .card .thumb { display: block; width: 100%; height: 160px; object-fit: contain; background: var(--bg); border: 2px solid var(--ink); filter: grayscale(100%) contrast(1.05); margin-bottom: 4px; }
  .card:hover .thumb { border-color: var(--accent); }
  .art-original-inline {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-family: 'Space Mono', monospace; font-size: 11.5px; font-weight: 700;
    letter-spacing: .4px; text-transform: uppercase; color: var(--accent);
    border-bottom: 2px solid var(--accent); padding-bottom: 1px; flex: none;
  }
  .art-original-inline:hover { color: var(--ink); border-color: var(--ink); }
  .art-original-inline svg { width: 13px; height: 13px; }

  /* ---- Materiales incluidos (artículos de la sección Materials) ---- */
  .art-materials { margin: 28px 0; }
  .art-materials h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }
  .art-materials h4 svg { width: 18px; height: 18px; color: var(--accent); }
  .materials-list { display: flex; flex-direction: column; gap: 2px; }
  .material-item { border: 2px solid var(--ink); background: var(--bg); padding: 14px 16px; }
  .material-item + .material-item { border-top: none; }
  .material-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .material-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15.5px; }
  .material-tag { flex: none; font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; background: var(--ink); color: #fff; padding: 3px 8px; }
  .material-desc { margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .material-cmd { display: block; margin-top: 10px; font-family: 'Space Mono', monospace; font-size: 12px; background: #f2f2f2; border: 1px solid #ddd; padding: 8px 10px; overflow-x: auto; white-space: pre; cursor: pointer; }
  .material-cmd:hover { border-color: var(--accent); color: var(--accent); }
  .material-cmd.copied { border-color: var(--accent); background: #fff0ea; color: var(--accent); }

  /* ---- Bloque de código largo (plantillas, etc.), con botón de copiar ---- */
  .code-block {
    position: relative; display: block; margin: 16px 0; font-family: 'Space Mono', monospace;
    font-size: 12.5px; line-height: 1.65; background: #f7f7f7; border: 2px solid var(--ink);
    padding: 30px 18px 18px; overflow-x: auto; white-space: pre; cursor: pointer;
  }
  .code-block:hover { border-color: var(--accent); }
  .code-block.copied { border-color: var(--accent); background: #fff0ea; }
  .code-block::before {
    content: 'Copiar'; position: absolute; top: 8px; right: 10px;
    font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted); background: #fff; padding: 3px 7px; border: 1px solid #ddd;
  }
  .code-block:hover::before { color: var(--accent); border-color: var(--accent); }
  .code-block.copied::before { content: 'Copiado ✓'; color: var(--accent); border-color: var(--accent); background: #fff0ea; }
  .material-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; text-decoration: none; }
  .material-link:hover { color: var(--accent); }
  .material-link svg { width: 12px; height: 12px; }

  /* ---- Spotlight search ---- */
  .spotlight {
    position: fixed; inset: 0; background: rgba(10,10,10,0.55); z-index: 60;
    display: none; align-items: flex-start; justify-content: center; padding-top: 12vh;
  }
  .spotlight.open { display: flex; }
  .spotlight-panel {
    width: 100%; max-width: 620px; margin: 0 24px; background: var(--bg);
    border: 2px solid var(--ink); box-shadow: 10px 10px 0 rgba(0,0,0,0.25);
    max-height: 70vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .spotlight-input-row { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 2px solid var(--ink); }
  .spotlight-input-row svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .spotlight-input-row input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: 'Space Grotesk', sans-serif; font-size: 18px; color: var(--ink);
  }
  .spotlight-results { overflow-y: auto; }
  .spotlight-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px; cursor: pointer;
    text-decoration: none; color: var(--ink); border-bottom: 1px solid #eee;
  }
  .spotlight-item:last-child { border-bottom: none; }
  .spotlight-item:hover, .spotlight-item.sel { background: var(--accent); color: #fff; }
  .spotlight-item .icon { width: 18px; height: 18px; flex: none; }
  .spotlight-item .meta { flex: 1; min-width: 0; }
  .spotlight-item .meta b { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spotlight-item .meta span { display: block; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .spotlight-item:hover .meta span, .spotlight-item.sel .meta span { color: rgba(255,255,255,.85); }
  .spotlight-empty { padding: 24px 18px; color: var(--muted); font-size: 13.5px; text-align: center; }
  .spotlight-hint { font-family: 'Space Mono', monospace; font-size: 10.5px; color: var(--muted); padding: 10px 18px; border-top: 1px solid #eee; }

  /* ---- Rating (stars) ---- */
  .art-rating { display: flex; align-items: center; gap: 10px; margin: 4px 0 22px; }
  .art-rating .rlabel { font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .art-rating .stars { display: flex; gap: 3px; }
  .art-rating .star-btn { border: none; background: transparent; padding: 2px; cursor: pointer; color: var(--ink); }
  .art-rating .star-btn svg { width: 21px; height: 21px; display: block; }
  .art-rating .star-btn:hover, .art-rating .star-btn.on { color: var(--accent); }

  /* ---- Footer ---- */
  footer.site-footer { border-top: 4px solid var(--ink); margin-top: 60px; background: var(--ink); color: #fff; }
  footer.site-footer .footer-inner { padding: 44px 24px 40px; text-align: center; }
  footer.site-footer .footer-brand { font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 22px; letter-spacing: -.5px; text-transform: uppercase; }
  footer.site-footer .footer-brand span { color: var(--accent); }
  footer.site-footer .footer-tag { font-family: 'Space Mono', monospace; font-size: 11.5px; letter-spacing: .5px; color: rgba(255,255,255,.55); margin-top: 10px; }
  footer.site-footer .footer-meta { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.35); margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.15); }

  ::selection { background: var(--accent); color: #fff; }

  /* ---- Historial: tabla con scroll horizontal en móvil ---- */
  .hist-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ================= RESPONSIVE ================= */

    .rail .card { flex: 0 0 86vw; }

<script>
const ARTICLES = [{"id": "aprendizaje-por-refuerzo-basico", "title": "Cómo funciona el aprendizaje por refuerzo", "url": "https://example.com/rl-basics", "section": "teoria", "subsection": "Fundamentos de ML", "summary": "Introducción a los conceptos básicos del aprendizaje por refuerzo: agente, entorno, recompensa y política. Explica por qué es distinto al aprendizaje supervisado y por qué importa para diseñar producto con IA.", "key_points": ["El agente aprende por prueba y error, maximizando una recompensa acumulada", "La política define qué acción tomar en cada estado", "El trade-off exploración vs explotación es central", "Es la base de sistemas que se adaptan al comportamiento del usuario en tiempo real"], "content_md": "## De qué va\n\nEl aprendizaje por refuerzo (RL) es una familia de algoritmos donde un **agente** aprende a tomar decisiones interactuando con un **entorno**, recibiendo una **recompensa** por cada acción. A diferencia del aprendizaje supervisado, no hay un dataset de respuestas correctas: el agente aprende por prueba y error.\n\n## Por qué le importa a un product designer\n\n- Los sistemas de recomendación y personalización usan variantes de RL para adaptarse al comportamiento real del usuario, no solo a datos históricos.\n- Entender el trade-off entre *exploración* (probar cosas nuevas) y *explotación* (usar lo que ya funciona) ayuda a diseñar mejores experiencias de onboarding y experimentación.\n- La 'función de recompensa' es, en el fondo, una decisión de producto: qué comportamiento queremos incentivar.\n\n## Ideas clave\n\n- El agente aprende por prueba y error, maximizando una recompensa acumulada.\n- La política define qué acción tomar en cada estado.\n- El trade-off exploración vs explotación es central.\n- Es la base de sistemas que se adaptan al comportamiento del usuario en tiempo real.\n", "date_added": "2026-07-12", "images": ["images/aprendizaje-por-refuerzo-basico/cover.svg"]}, {"id": "meta-abre-astryx-su-design-system-interno-y-ya-funciona-en-figma-make", "title": "Meta abre Astryx, su design system interno, y ya funciona en Figma Make", "url": "https://www.linkedin.com/posts/achyut-khanpara_designsystems-figmamake-uxdesign-share-7480456616299917312-4U0C/", "section": "novedades", "subsection": "Figma Make", "summary": "Meta ha hecho open source su design system interno (usado en más de 13.000 apps) y alguien lo ha probado dentro de Figma Make: se instala con un simple prompt, genera output real aunque aún en beta, y se puede personalizar sin tocar código. Lo más interesante no son los componentes, sino que viene con CLI + servidor MCP para que los agentes de IA lo lean directamente.", "key_points": ["Astryx es el design system interno de Meta, usado en 13.000+ apps durante 8 años, ahora open source", "Se instala en Figma Make con un prompt que tira del paquete público de npm, sin setup manual", "Aún en beta: genera resultados reales pero con algún error mid-generación, no es un one-shot limpio", "Se puede pedir a Figma Make que personalice colores, spacing y comportamiento por lenguaje natural", "Lo relevante no es el kit de componentes: Astryx incluye CLI + servidor MCP para que agentes de IA lo lean directamente, no solo desarrolladores"], "content_md": "## De qué va\nMeta ha abierto el código de Astryx, su design system interno usado en más de 13.000 apps durante 8 años. Achyut Khanpara probó si funciona dentro de Figma Make: basta con pedirle que instale los paquetes `@astryxdesign/core` y `@astryxdesign/theme-neutral` desde npm y que construya una pantalla con sus componentes, sin instalación manual. Funciona, pero todavía en beta: hay que esperar algún error intermedio antes de que el resultado se asiente.\n\n## Por qué le importa a un product designer\nMás allá de los componentes, lo interesante es que Astryx sale de fábrica con un CLI y un servidor MCP pensados para que agentes de IA lo lean directamente, no solo desarrolladores. Es una pista de hacia dónde van los design systems: no solo documentados para humanos, sino estructurados para que la IA los use como fuente de verdad al generar UI.\n\n## Ideas clave\n- Astryx es el design system interno de Meta (13.000+ apps, 8 años), ahora open source.\n- Se instala en Figma Make con un prompt, tirando del paquete público de npm.\n- Aún en beta: genera output real pero con algún error mid-generación.\n- Se puede personalizar (colores, spacing, comportamiento) por lenguaje natural, sin tocar código.\n- Lo importante no es el kit de componentes, es el CLI + MCP: diseñado para que los agentes de IA lo consuman directamente.", "images": ["images/meta-abre-astryx-su-design-system-interno-y-ya-funciona-en-figma-make/cover.svg"], "glossary": [{"term": "CLI (Command Line Interface)", "definition": "Una forma de controlar un programa escribiendo comandos de texto en vez de hacer clic en botones — es la 'interfaz' que usan desarrolladores (y ahora agentes de IA) para instalar y manejar herramientas como Astryx. Piénsalo como el equivalente en código a un menú de opciones, pero escrito."}, {"term": "Servidor MCP (Model Context Protocol)", "definition": "Un protocolo que permite que un agente de IA se conecte directamente a una herramienta o base de datos y la use, en vez de que un humano tenga que ir explicándole cómo hacerlo cada vez. Piénsalo como un 'enchufe universal' entre la IA y el software que ya existe — es lo que permite que Figma Make 'entienda' Astryx sin que nadie le enseñe manualmente."}, {"term": "npm (registro de paquetes)", "definition": "Un catálogo público enorme donde desarrolladores publican piezas de código reutilizable ('paquetes'), como Astryx, para que cualquiera pueda instalarlas con un comando en vez de construirlas desde cero. Es parecido a una librería de plugins, pero para código."}], "date_added": "2026-07-12"}, {"id": "claude-agents-que-son-y-como-crear-uno", "title": "Claude Agents: qué son y cómo crear uno", "url": "https://yummy-design-sprint.notion.site/Claude-Agents-What-are-they-how-to-create-one-38e6279147098049a74ae0de250a51a1", "section": "practica", "subsection": "Agentes de IA", "summary": "Guía en lenguaje llano de Yummy Labs sobre qué es realmente un 'agente' de IA, pensada para diseñadores. La idea central: un agente no es una cosa técnica, es un trabajo que diseñas — le das un objetivo, unas herramientas y unos límites, y es Claude quien decide los pasos. Incluye ocho agentes concretos que puede construir un diseñador y un ejemplo completo, paso a paso, de un 'design reviewer'.", "key_points": ["La diferencia entre task, workflow y agente está en quién decide los pasos: tú, tú (pero programado), o Claude", "Las 'herramientas' (tools) son las manos y ojos del agente: qué puede leer, buscar, escribir o ejecutar — dárselas es una decisión de diseño, no un detalle técnico", "Diseñar un buen agente es como hacer el onboarding de un rol: un objetivo claro, pocas herramientas bien descritas, acceso a su propio resultado para autocorregirse, y límites que le impidan actuar sin control", "Un agente compensa cuando los pasos no se pueden mapear de antemano Y el resultado es verificable; si ya sabes los pasos, un workflow es más simple y predecible", "Cuando un agente vive en el proyecto compartido del equipo (no en el chat de una persona), los criterios de revisión dejan de vivir solo en la cabeza de una persona senior y se vuelven un estándar compartido, versionado y aplicado igual a todo el mundo"], "content_md": "## De qué va\nUna guía de Yummy Labs pensada específicamente para diseñadores, sin dar por hecho ningún conocimiento técnico. La idea que explica todo el tema: un agente no es necesariamente algo técnico, es un trabajo que tú diseñas. Le das a Claude un objetivo, las herramientas para alcanzarlo y los límites para no salirse de madre, y él decide los pasos.\n\n## La diferencia entre task, workflow y agente\nLa línea honesta que separa los tres es quién decide los pasos:\n\n- **Task** — tú piensas los pasos, Claude hace uno. Ejemplo: \"reescribe este texto de estado vacío\".\n- **Workflow** — tú programas la secuencia de pasos, Claude rellena cada uno. Ejemplo: \"agrupa estas notas, luego mapéalas, luego resume\".\n- **Agente** — tú das el objetivo, Claude decide los pasos. Ejemplo: \"revisa esta pantalla contra nuestro design system y señala qué se desvía\".\n\n¿Chatear con Claude es \"usar un agente\"? Normalmente no, eso es una task. Se convierte en agente en el momento en que entra en bucle: usa herramientas, lee sus propios resultados y decide qué hacer a continuación hacia el objetivo que le diste.\n\n## Qué son realmente las 'herramientas' (tools)\nLas herramientas son las manos y ojos del agente: lo que puede mirar y hacer.\n\n- **Integradas en Claude Code**: leer un archivo, buscar dentro de archivos, encontrar archivos por patrón, modificar un archivo, ejecutar un comando (por ejemplo, hacer una captura de pantalla o correr tests).\n- **Conectadas por MCP**: leer un frame de Figma o sus variables, leer y actualizar una página de Notion, redactar un email, consultar una base de datos.\n- **Personalizadas**: cualquier función que definas tú, como crear un ticket o publicar en un CMS.\n\nQué herramientas le das a un agente es una decisión de diseño: un agente revisor recibe herramientas de solo lectura y nunca la de escribir, así puede mirar pero nunca tocar.\n\n## Cómo diseñar un buen agente\nTrátalo como el onboarding de un rol, no como escribir un prompt:\n\n- **Un solo trabajo por agente.** Objetivo y límites claros; objetivo vago, agente vago.\n- **Pocas herramientas, bien elegidas y bien descritas.** Más herramientas no es mejor.\n- **Dale acceso a su propia verdad de campo**: que pueda leer su propio resultado (una captura, un test, un diff) para autocorregirse.\n- **Acótalo y dale un límite de parada**, por ejemplo un número máximo de intentos.\n- **Que sea transparente**: que muestre su plan, para que se entienda por qué hizo lo que hizo.\n\n## Cuándo compensa un agente (y cuándo no)\nUsa un agente cuando los pasos no se pueden mapear de antemano Y el resultado es verificable, y cuando merece la pena el coste extra de tiempo y tokens. Usa algo más simple —una task o un workflow— cuando ya sabes los pasos o cuando la velocidad y la predictibilidad importan más. La regla de Anthropic: busca lo más simple que funcione, y añade autonomía solo cuando mejora claramente el resultado.\n\n## Las desventajas reales\nLos agentes son más lentos y caros (exploran, y explorar gasta tokens), menos predecibles (el mismo input puede dar resultados distintos en cada ejecución) y los errores se acumulan en cada paso del bucle. Mitigaciones: mantenerlos de solo lectura cuando se pueda, poner a una persona en los puntos de control, probar en un entorno seguro y añadir límites de parada.\n\n## Ocho agentes que puede construir un diseñador\nCada uno funciona porque la tarea necesita criterio, pero el resultado es verificable:\n\n1. **Revisor de diseño** — compara una pantalla construida contra el design system y la referencia.\n2. **Auditor de accesibilidad** — revisa contraste, tamaño de zonas táctiles, orden de foco, texto alternativo.\n3. **Sintetizador de research** — convierte notas de entrevistas en temas y patrones.\n4. **Revisor de copy y voz** — detecta microcopy que se sale de la guía de voz.\n5. **Auditor de uso de componentes** — encuentra valores sueltos que deberían usar el sistema.\n6. **Análisis competitivo** — dado un flujo, recopila cómo lo resuelven otros y resume patrones.\n7. **Agente que construye pantallas** — construye una pantalla desde una spec y la va comparando y corrigiendo hasta que encaja (con una persona supervisando, porque edita archivos).\n8. **Auditor de flujo** — recorre un prototipo contra una spec escrita y señala estados que faltan: vacío, cargando, error, éxito.\n\n## Ejemplo completo: el revisor de diseño, cableado de principio a fin\nHay dos tipos de herramientas que le das a este agente. El primer cajón es su núcleo, integrado en Claude Code y sin tocar internet: leer archivos, buscar en el código, encontrar archivos, ejecutar comandos (capturas, diffs, tests de accesibilidad). El segundo cajón son los conectores (MCP), la parte que suele resultar confusa: Figma le deja comparar contra el frame real; Notion le deja leer una spec o escribir sus hallazgos; Linear/Jira le deja crear un ticket por cada problema; Slack le deja avisar al canal del equipo. Un conector se convierte en herramienta disponible en el momento en que lo activas en Ajustes.\n\nEl flujo típico: le describes el trabajo a Claude como si hicieras un brief a alguien nuevo en el equipo (qué herramientas tiene, cuál no —normalmente 'escribir'—, y qué cuenta como 'bien'), Claude guarda ese agente como un archivo dentro del proyecto, y luego lo invocas por su nombre cada vez que quieras que revise una pantalla. La misma base se puede reescribir para distintos trabajos con una frase extra y el conector correspondiente: comparar contra Figma, registrar en una base de Notion, crear tickets en Linear, avisar por Slack, o sumar una auditoría de accesibilidad.\n\n## Por qué le importa a un product designer\nCuando un agente vive en el proyecto compartido del equipo, y no en el historial de chat de una persona, los criterios de revisión dejan de vivir solo en la cabeza del diseñador senior: quedan escritos, versionados y se aplican igual a todo el mundo. Escala el criterio de una persona en vez de depender de que esté en la sala, conecta diseño, producto e ingeniería (que viven en apps distintas) y elimina el cuello de botella de esperar a que la única persona que conoce el sistema tenga hueco. El aviso honesto: un agente conecta el trabajo, no sustituye la conversación — usado mal, cada uno se aísla con su propia IA en vez de hablar más.", "images": ["images/claude-agents-que-son-y-como-crear-uno/cover.svg"], "glossary": [{"term": "Subagente", "definition": "Un agente con un único trabajo, guardado como un pequeño archivo dentro de la carpeta oculta `.claude/agents/` de tu proyecto. No hace falta crearlo a mano: le describes el trabajo a Claude (qué herramientas tiene, qué no, qué cuenta como 'bien hecho') y él escribe el archivo. Una vez creado, lo invocas por su nombre cada vez que lo necesites, como llamar a un compañero especializado."}, {"term": "Conector MCP", "definition": "La forma en que un agente se conecta a una herramienta real que ya usas — Figma, Notion, Linear, Slack — en vez de quedarse solo con lo que hay en el proyecto. Solo se convierte en algo que el agente puede usar cuando tú lo activas explícitamente en Ajustes; a partir de ahí se le entrega igual que cualquier otra herramienta."}, {"term": "Guardrails (límites del agente)", "definition": "Las reglas que acotan lo que un agente puede hacer mientras trabaja solo — por ejemplo, darle acceso de solo lectura para que pueda revisar pero nunca modificar archivos, o ponerle un número máximo de intentos para que no se quede dando vueltas indefinidamente."}, {"term": "Claude Agent SDK", "definition": "La vía para desarrolladores: el mismo concepto de agente, pero convertido en código para que funcione de forma fiable dentro de un producto y para otras personas, no solo para ti en una conversación. Es la ruta que tomaría tu equipo de ingeniería si quisiera llevar uno de estos agentes más allá de tu propio uso."}], "date_added": "2026-07-12"}, {"id": "donde-va-realmente-tu-contexto-de-diseno-en-claude", "title": "Dónde va realmente tu contexto de diseño en Claude", "url": "https://yummy-design-sprint.notion.site/Where-your-design-context-actually-belongs-in-Claude-35962791470980be91fac4fc3c977fa1", "section": "practica", "subsection": "Claude para diseñadores", "summary": "Guía práctica de Yummy Labs sobre las tres capas donde puedes meter contexto de diseño en Claude —Custom Instructions, Project Knowledge y Skills— y por qué confundirlas hace que se te llene el contexto de cosas que no hacen falta. Explica cómo carga cada capa, qué poner en cada una, y aclara de una vez el bombo de los archivos .md tipo DESIGN.md.", "key_points": ["Custom Instructions se carga en TODOS los mensajes siempre: solo debe llevar lo que dirías en cualquier reunión sin importar el tema (máx. 400 palabras)", "Project Knowledge (archivos subidos) se carga entero si el proyecto es pequeño, o se busca por RAG si el proyecto es grande — hay que limpiar lo que no se use", "Las Skills solo cargan su nombre y descripción al arrancar (30-50 tokens), y el contenido completo solo se carga cuando Claude decide que es relevante para lo que pides", "La regla para decidir dónde va algo: si lo usarías también en tu próximo proyecto, es una Skill; si es específico de este proyecto, es Project Knowledge", "Un archivo .md (como corrections.md) no sustituye tu design system real (Figma, código, tokens) — es un documento de briefing para Claude, no una cuarta fuente de verdad"], "content_md": "## De qué va\nUna guía práctica sobre dónde meter el contexto de diseño en Claude, basada en la documentación oficial de Anthropic. Antes de responder a nada, Claude ya está leyendo tres cosas: tus Custom Instructions, los archivos que has subido al proyecto, y qué Skills podrían ser relevantes. Cada una carga de forma distinta, y entender esa diferencia es lo que separa una configuración que funciona de una que malgasta tu ventana de contexto.\n\n## Las tres capas, en corto\n- **Custom Instructions** se cargan en cada mensaje, siempre. Siempre activas, siempre consumiendo tokens.\n- **Project Knowledge** (archivos subidos) se carga entero en proyectos pequeños, o se busca por RAG en proyectos grandes.\n- **Skills** solo cargan su nombre y descripción al arrancar (30-50 tokens cada una). El contenido completo se carga solo cuando Claude decide que hace falta.\n\n## Custom Instructions\nEs el texto que Claude lee al principio de cada conversación de un Proyecto, antes incluso de ver tu mensaje. Aquí va lo que Claude nunca debería olvidar, sin importar qué le pidas — cada palabra aquí cuesta tokens en cada turno.\n\nEjemplos buenos: \"Soy product designer de nivel medio construyendo un dashboard B2B para iOS y web\", \"Usa siempre una grid de 8px, zona táctil mínima 44x44px\", \"Cuando pida un componente, incluye estados hover, focus y disabled\", \"Nunca sugieras Inter, Roboto ni fuentes de sistema\".\n\nLo que NO va aquí: tu lista completa de tokens (eso es Project Knowledge), documentación larga de procesos (eso es una Skill), instrucciones específicas de una tarea puntual (eso va en el propio chat). Regla general: si lo dirías en cualquier reunión sin importar el tema, va aquí. Si solo aplica a ciertas tareas, no. Extensión recomendada: 200-400 palabras, algunos incluso dicen que no pases de 500.\n\n## Project Knowledge\nSon los archivos que subes a la base de conocimiento de un Proyecto (PDFs, imágenes, JSON, markdown, código), disponibles en todas las conversaciones de ese Proyecto.\n\nAquí está la parte que más gente entiende mal: en proyectos pequeños (pocos archivos, muy por debajo del límite de contexto), Claude carga tus archivos directamente en cada mensaje, todo el rato. En proyectos grandes (cerca del límite), Claude cambia automáticamente a modo RAG: en vez de cargarlo todo, busca y trae solo las piezas relevantes para cada pregunta.\n\nQué subir aquí: un `design-tokens.json` con los valores reales de ESTE proyecto (no uno genérico), el brand guide del cliente en PDF, 3-5 capturas de la dirección visual que buscas, y sobre todo un `corrections.md` — cada vez que corriges a Claude (\"las cards son de 16px de radio, no 12px\"), lo apuntas ahí y Claude deja de repetir el mismo error en la siguiente sesión. Es, según la guía, de lo más rentable que puedes hacer.\n\nQué NO subir: archivos de proyectos ya terminados, un PDF de 40 páginas de documentación completa del design system (mejor un resumen enfocado), cosas que usas en TODOS tus proyectos (eso es una Skill, no hace falta copiarlo en cada Proyecto), o archivos enormes \"por si acaso\".\n\n## Skills\nSon conjuntos de instrucciones portátiles que te acompañan a todos los sitios: en todos tus Proyectos, en chats normales, en Claude Code. Es tu criterio empaquetado para que Claude lo use donde haga falta.\n\nLa parte clave de cómo cargan se llama *progressive disclosure*: al arrancar, Claude solo lee el nombre y una descripción corta de cada Skill (unos 30-50 tokens). Cuando le pides algo relevante, compara tu petición contra esas descripciones y carga el contenido completo solo de las Skills que aplican. Las que no hacen falta se quedan sin usar, con coste cero. Es justo lo contrario de Project Knowledge en proyectos pequeños, donde todo se carga siempre.\n\nEjemplos: una Skill de \"UI Designer\" con tu filosofía de spacing y tus mínimos de contraste; una Skill de \"UX Copywriter\" con tus reglas de microcopy; una Skill de marca por cliente (nómbrala por el cliente, no \"brand.md\", para que Claude active la correcta); una Skill de accesibilidad con tus estándares WCAG.\n\nQué NO poner en una Skill: valores de tokens específicos de un proyecto (eso es Project Knowledge), una única Skill gigante que lo cubra todo (Anthropic recomienda varias Skills enfocadas en vez de una mega-Skill), material de referencia de un solo uso, o contenido que cambia en cada proyecto. La pregunta que resuelve la duda: ¿usarías esta regla también en tu próximo proyecto? Si sí, es una Skill. Si no, es Project Knowledge.\n\n## ¿Y los archivos .md tipo DESIGN.md?\nUn .md es simplemente texto plano con formato sencillo (# para títulos, - para listas). No es código, no es una base de datos, no es una herramienta de diseño. Claude lo procesa más barato y más rápido que un PDF con la misma información, y además está más estructurado, así que encuentra secciones concretas de forma más fiable.\n\nDónde ayuda: un `corrections.md` (probablemente el archivo más rentable que puedes crear), un `design-rules.md` con tu escala de spacing y el razonamiento de cuándo usar cada valor (no solo el número, también el porqué), o un `brand-brief.md` con la versión condensada de una marca para un proyecto concreto.\n\nDónde NO ayuda: si intentas que sustituya tu design system real (que vive en Figma, en código, en tu librería de componentes) — si mantienes el .md Y tus variables de Figma Y tus tokens de código, has creado tres fuentes de verdad que van a desincronizarse. Tampoco ayuda si el archivo se vuelve gigante (si tu DESIGN.md tiene 500+ líneas, probablemente está haciendo demasiado — lo ideal son 100-200 líneas), ni si el contenido cambia constantemente (mejor conectar Claude a Figma vía MCP para acceso en vivo: el .md es una foto fija, MCP es una conexión viva). El error más habitual: tratar un DESIGN.md como si FUERA el design system, cuando en realidad es solo el briefing que le das a Claude.\n\n## Coste real en tokens\nLa ventana de contexto de Claude en los planes de pago es de 200.000 tokens. Unas Custom Instructions de 300 palabras cuestan ~400 tokens (0,2%), un `design-tokens.json` unos 1.000-3.000 tokens, un `corrections.md` unos 500-1.000, y una Skill sin activar prácticamente nada (30-50 tokens). Una configuración bien organizada suele usar solo un 3-8% del contexto, dejando el resto libre para el trabajo real.\n\n## Ideas clave\n- Custom Instructions carga en cada mensaje, siempre — solo lo verdaderamente universal, bajo 400 palabras.\n- Project Knowledge se carga entero en proyectos pequeños o se busca por RAG en proyectos grandes; limpia lo que no uses.\n- Skills solo cargan nombre + descripción hasta que son relevantes; mejor varias Skills enfocadas que una mega-Skill.\n- La pregunta test: ¿lo usarías en tu próximo proyecto? Skill. ¿Es de este proyecto? Project Knowledge.\n- Un .md es un documento de briefing para Claude, no un reemplazo de tu design system real.", "images": ["images/donde-va-realmente-tu-contexto-de-diseno-en-claude/cover.svg"], "glossary": [{"term": "Ventana de contexto (context window)", "definition": "La cantidad total de texto que Claude puede \"tener en la cabeza\" a la vez en una conversación, medida en tokens (200.000 en los planes de pago). Todo lo que subes, escribes o Claude carga automáticamente compite por ese mismo espacio limitado — por eso importa tanto qué metes ahí y cómo carga cada cosa."}, {"term": "RAG (Retrieval-Augmented Generation)", "definition": "Una técnica en la que, en vez de cargar todos tus archivos en cada mensaje, el sistema busca solo las partes relevantes para tu pregunta concreta y las trae al contexto. Es lo que activa Claude automáticamente cuando un Proyecto tiene demasiados archivos para caber todos a la vez."}, {"term": "Custom Instructions", "definition": "El bloque de texto que Claude lee al principio de cada conversación dentro de un Proyecto, antes de ver tu mensaje. Es tu contexto \"siempre activo\": quién eres, qué construyes, tus reglas que nunca cambian — pensado para ser corto porque se paga en tokens en cada turno."}, {"term": "Progressive disclosure (de una Skill)", "definition": "La forma en que carga una Skill: al principio Claude solo ve su nombre y una frase descriptiva (casi gratis en tokens); solo si tu petición encaja con esa descripción, Claude carga el contenido completo de la Skill. Es lo que permite tener muchas Skills guardadas sin que cuesten nada hasta que realmente se usan."}], "date_added": "2026-07-12"}, {"id": "los-disenadores-gastan-los-limites-de-uso-de-claude-mas-rapido-que-nad", "title": "Los diseñadores gastan los límites de uso de Claude más rápido que nadie: por qué y cómo arreglarlo", "url": "https://yummy-design-sprint.notion.site/Designers-hit-Claude-s-usage-limits-faster-than-anyone-Here-s-why-and-exactly-how-to-fix-it-33562791470980b78c4bc906178bc83f", "section": "practica", "subsection": "Claude para diseñadores", "summary": "Guía de Yummy Labs sobre por qué el trabajo de diseño agota los límites de uso de Claude más rápido que casi cualquier otro tipo de trabajo, y qué hacer al respecto. El problema de fondo: cada mensaje reprocesa TODA la conversación anterior, así que el mensaje 30 cuesta como los 30 mensajes juntos. Repasa los patrones típicos de un diseñador que disparan el gasto (iterar visualmente, MCP de Figma, seleccionar la página entera, usar Opus por defecto) y cómo arreglar cada uno.", "key_points": ["Cada mensaje reprocesa toda la conversación anterior: el mensaje 30 cuesta como si reenviaras los 30 mensajes de golpe, por eso pedir 'un poco más grande' cinco veces seguidas dispara el gasto", "Hay dos variables distintas: el coste por token (qué modelo usas, Opus cuesta 5x más que Sonnet) y el consumo real (tus hábitos: subir un PDF entero, dejar que Claude escriba de más, alargar una conversación 30 mensajes)", "Seleccionar la página entera en Figma MCP en vez de solo el componente puede costar 200.000+ tokens frente a 2.000-10.000 — una diferencia de 20 a 100 veces", "Cada conector MCP que tienes activo carga su definición en TODOS los mensajes, aunque no lo uses ese turno: 4 herramientas conectadas pueden suponer ~7.000 tokens de sobrecoste por mensaje", "Se puede crear una Skill que 'entrene' a Claude para ser consciente de los tokens (o para acertar a la primera en tareas que repites), en vez de depender de corregirlo en cada conversación"], "content_md": "## De qué va\nUna guía de Yummy Labs sobre por qué los diseñadores queman los límites de uso de Claude más rápido que casi cualquier otro perfil, y qué hacer para arreglarlo sin dejar de trabajar bien.\n\n## El problema de fondo\nCada mensaje que envías a Claude reprocesa TODA la conversación anterior. El mensaje número 30 cuesta como si volvieras a enviar del 1 al 30 juntos. Por eso pedir \"hazlo un poco más grande\" cinco veces seguidas, cada una en su propio mensaje, es tan caro: cada ronda relee todo lo anterior.\n\n## Las dos cosas que gastan tu límite\n- **Coste por token**: lo que cuesta cada token contra tu límite, s
